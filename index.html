<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4f91">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Blacklock XI</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky team scoreboard header, then one column of round boards (Ryder Cup manual-board style), phone first. */
:root{
  color-scheme:light;
  --bg:#eef2ec; --surface:#ffffff; --surface2:#f6f8f4; --ink:#14201a; --muted:#5a6a60; --line:#d6ddd3;
  --accent:#1e6b45; --warn:#9a6a00; --warn-bg:#fff4d6; --bad:#b3261e;
  --ta:#1d4f91; --tb:#b42335; --on-team:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0c130f; --surface:#141e18; --surface2:#1a261f; --ink:#e5ece6; --muted:#93a399; --line:#27352d;
  --accent:#5cc28c; --warn:#f2c14e; --warn-bg:#33290f; --bad:#ff8a80; color-scheme:dark }}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 0;display:grid;gap:8px}
.evline{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.evname{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.02em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evname small{font-family:var(--body);font-weight:500;font-size:.75rem;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:6px}
.evmeta{font-size:.78rem;color:var(--muted);white-space:nowrap}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:1px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-radius:var(--r);overflow:hidden;cursor:pointer}
.board:hover .big{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.modal.centre{align-items:center;padding:12px}
.scard{max-width:420px;border-radius:16px!important;max-height:calc(100% - 24px)!important;text-align:center}
.scard .top{position:relative;color:var(--on-team);background:linear-gradient(90deg,var(--ta) 50%,var(--tb) 50%);padding:16px 14px 14px;display:grid;gap:4px;justify-items:center}
.scard .top .x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:var(--on-team);font-size:1rem}
.scard .crest{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);margin-bottom:2px}
.scard .ev{font-weight:600;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.scard .totals{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;width:100%}
.scard .totals .tn{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase}
.scard .totals .tn.a{text-align:right} .scard .totals .tn.b{text-align:left}
.scard .totals .big2{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.scard .sub2{font-size:.74rem;opacity:.9}
.scard .rounds{padding:6px 14px 10px}
.scard .rr{display:grid;gap:3px;justify-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.scard .rr:last-child{border-bottom:0}
.scard .rn{font-family:var(--display);font-weight:700;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scard .sc2{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.9rem;white-space:nowrap}
.scard .sc2 .tl{width:5.8rem;overflow:hidden;text-overflow:ellipsis} .scard .sc2 .tl.a{text-align:right} .scard .sc2 .tl.b{text-align:left}
.scard .sc2 .chip{font-family:var(--display);font-size:1.25rem;min-width:2.1em;padding:1px 6px}
.scard .rd{color:var(--muted);font-size:.72rem}
.scard .foot{font-size:.7rem;color:var(--muted);padding:0 14px 12px}
.side{color:var(--on-team);padding:8px 12px;display:grid;grid-template-columns:1fr auto;align-items:end;min-width:0}
.side.a{background:var(--ta)} .side.b{background:var(--tb);grid-template-columns:auto 1fr;text-align:right}
.tname{font-family:var(--display);font-weight:600;font-size:1rem;text-transform:uppercase;letter-spacing:.06em;line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj{display:block;font-family:var(--body);font-size:.72rem;opacity:.85;text-transform:none;letter-spacing:0;font-weight:500}
.big{font-family:var(--display);font-weight:700;font-size:3rem;line-height:.9;font-variant-numeric:tabular-nums}
.bar{position:relative;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0}
.bar .mid{left:50%;width:2px;margin-left:-1px;background:var(--ink);opacity:.5}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;border:0;background:none;padding:10px 12px;font-weight:600;font-size:.88rem;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main.wrap{padding-block:16px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.mhead,.entry,.pinfo{min-width:0}
.pinfo{grid-template-columns:repeat(2,minmax(0,1fr))}
.notice{background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn);border-radius:var(--r);padding:10px 12px;font-size:.88rem}
.notice b{color:var(--warn)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted)}

.round{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2)}
.rhead h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.25rem;text-transform:uppercase;letter-spacing:.04em}
.rhead .sub{color:var(--muted);font-size:.8rem;flex-basis:100%;order:2;min-width:0}
.rhead .rule{flex-basis:100%;order:3;color:var(--muted);font-size:.74rem;line-height:1.35;max-width:65ch}
.rhead .rscore{order:1;margin-left:auto}
.rscore{font-family:var(--display);font-weight:700;font-size:1.15rem;display:flex;gap:6px;align-items:center}
.chip{display:inline-block;min-width:1.9em;text-align:center;padding:0 6px;border-radius:5px;color:var(--on-team);font-variant-numeric:tabular-nums}
.mrow{display:grid;grid-template-columns:1fr 92px 1fr;align-items:stretch;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:0;text-align:left}
.mrow:first-of-type{border-top:0}
.pair{padding:9px 10px;display:grid;gap:1px;min-width:0;font-weight:600;font-size:.9rem;line-height:1.25}
.pair span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pair small{font-weight:500;color:var(--muted);font-size:.72rem}
.pair.b{text-align:right}
.pair.lead{color:var(--on-team)} .pair.lead small{color:var(--on-team);opacity:.8}
.pair.a.lead{background:var(--ta)} .pair.b.lead{background:var(--tb)}
.pill{display:grid;place-content:center;text-align:center;font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1;padding:6px 2px;background:var(--surface2);border-inline:1px solid var(--line)}
.pill small{display:block;font-family:var(--body);font-weight:500;font-size:.68rem;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.pill.fin small{color:var(--ink)}
.tbc{color:var(--muted);font-weight:500;font-style:italic}

.back{border:0;background:none;color:var(--accent);font-weight:600;padding:0;justify-self:start}
.mhead{display:grid;gap:10px}
.mtitle{font-family:var(--display);font-weight:700;font-size:1.4rem;text-transform:uppercase;letter-spacing:.03em;margin:0}
.banner{display:grid;grid-template-columns:1fr auto 1fr;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.banner .pair{padding:10px 12px}
.banner .pill{min-width:96px;font-size:1.6rem}
.hstrip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.hstrip button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 0;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.hstrip button.wa{background:var(--ta);color:var(--on-team);border-color:transparent}
.hstrip button.wb{background:var(--tb);color:var(--on-team);border-color:transparent}
.hstrip button.hv{background:var(--surface2);color:var(--muted)}
.hstrip button.cur{outline:3px solid var(--ink);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.entry{padding:12px;display:grid;gap:10px}
.ehead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ehead .h{font-family:var(--display);font-weight:700;font-size:1.8rem;line-height:1}
.ehead .meta{color:var(--muted);font-size:.85rem}
.erow{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center}
.erow .stripe{align-self:stretch;border-radius:2px}
.erow .who{min-width:0}
.erow .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .who small{color:var(--muted);font-size:.75rem}
.dots{color:var(--accent);letter-spacing:1px;font-size:.8rem}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-size:1.3rem;font-weight:600;line-height:1}
.step .val{width:46px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums}
.step .val.x{font-size:1rem}
.step .pu{width:auto;border-radius:22px;padding:0 10px;font-size:.78rem;font-weight:700}
.step .pu[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.quick{display:grid;grid-template-columns:1fr auto 1fr;gap:6px}
.quick button{border:2px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px 6px;font-weight:700;font-size:.88rem;line-height:1.15}
.quick button.qa{border-color:var(--ta);color:var(--ta)} .quick button.qb{border-color:var(--tb);color:var(--tb)}
.quick button.qa[aria-pressed="true"]{background:var(--ta);color:var(--on-team)}
.quick button.qb[aria-pressed="true"]{background:var(--tb);color:var(--on-team)}
.quick button.qh[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.orline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
.orline::before,.orline::after{content:"";flex:1;border-top:1px solid var(--line)}
.erow.muted{opacity:.45}
.efoot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.efoot .res{font-weight:600;font-size:.9rem;flex:1;min-width:140px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.pinfo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pinfo .card{padding:10px 12px;font-size:.85rem;display:grid;gap:4px}
.pinfo .card .t{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pinfo .ln{display:flex;justify-content:space-between;gap:8px}
.pinfo .ln span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
.sc th,.sc td{border:1px solid var(--line);padding:5px 6px;text-align:center;min-width:30px}
.sc th:first-child,.sc td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);min-width:96px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1}
.sc thead th{background:var(--surface2);font-weight:700}
.sc .tot{background:var(--surface2);font-weight:700}
.sc td.cnt{font-weight:800;text-decoration:underline;text-underline-offset:3px}
.sc td.ra{background:var(--ta);color:var(--on-team)} .sc td.rb{background:var(--tb);color:var(--on-team)}
.sc td.rh{color:var(--muted)}
.sc sup{color:var(--accent);font-size:.6rem;margin-left:1px}
.sc th.cur{outline:2px solid var(--ink);outline-offset:-2px}
.sc .lbl{color:var(--muted);font-weight:600}
.list th,.list td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.list th:first-child,.list td:first-child{text-align:left}
.list thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.list tr.click{cursor:pointer} .list tr.click:hover td{background:var(--surface2)}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px}
.teamcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.teamcard h3{margin:0;padding:8px 12px;color:var(--on-team);font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:1.1rem}
h2.sec{font-family:var(--display);font-weight:700;font-size:1.25rem;text-transform:uppercase;letter-spacing:.04em;margin:0}
p.lead{margin:0;color:var(--muted);max-width:65ch}

.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.form h3{margin:0;font-family:var(--display);font-weight:700;font-size:1.15rem;text-transform:uppercase;letter-spacing:.04em}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label.f{display:grid;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--surface2);padding:8px 9px;font-size:.95rem;min-width:0}
input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);padding:2px}
textarea{min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
.holes{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.holes .hc{display:grid;gap:3px;text-align:center;font-size:.72rem;color:var(--muted);font-weight:700}
.holes input{padding:6px 2px;text-align:center}
.pairrow{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.pairrow .mn{font-family:var(--display);font-weight:700;font-size:1.1rem;grid-row:span 2}
.pairrow .ps{display:grid;gap:4px;min-width:0;border-left:4px solid;padding-left:8px}
.pairrow .prev{grid-column:2/4;font-size:.78rem;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr 110px 72px 58px auto;gap:6px;align-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.capt{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;font-size:.68rem;font-weight:800;letter-spacing:.04em;color:var(--on-team);vertical-align:2px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,16,12,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:100%;max-width:480px;max-height:calc(100% - 32px);overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.sheet header{color:var(--on-team);padding:16px 18px 14px;display:grid;gap:2px;position:relative}
.sheet header h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.8rem;line-height:1;text-transform:uppercase;letter-spacing:.03em;padding-right:36px}
.sheet header .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:var(--on-team);font-size:1.2rem}
.sheet .body{padding:16px 18px 18px;display:grid;gap:12px}
.sheet .bio{white-space:pre-line;line-height:1.55;max-width:65ch}
.sheet .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.sheet .stats div{background:var(--surface2);border-radius:8px;padding:6px 2px;font-size:.72rem;color:var(--muted)}
.sheet .stats b{display:block;font-family:var(--display);font-size:1.35rem;color:var(--ink)}
@media (max-width:520px){.modal{align-items:flex-end;padding:0}.sheet{border-radius:14px 14px 0 0;max-height:88%;padding-bottom:env(safe-area-inset-bottom,0px)}}
.bands{columns:3 9rem;column-gap:18px;font-size:.8rem;font-variant-numeric:tabular-nums}
.bands div{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px solid var(--line);break-inside:avoid}
.bands b{font-family:var(--display);font-size:.95rem}
details.tee{border-top:1px solid var(--line);padding-block:8px}
details.tee summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
details.tee summary span{color:var(--muted);font-weight:500;font-size:.85rem}
.ccbig{font-size:1.4rem;max-width:12rem;font-family:var(--display);font-weight:700}
.sc .tee td:first-child{font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}

@media (max-width:520px){
  .big{font-size:2.5rem}
  .mrow{grid-template-columns:1fr 78px 1fr}
  .pill{font-size:1.15rem}
  .pair{font-size:.84rem;padding:8px}
  .pinfo{grid-template-columns:1fr}
  .holes{grid-template-columns:repeat(6,minmax(0,1fr))}
  .prow{grid-template-columns:1fr 84px 56px 50px auto}
  .step button{width:40px;height:40px}
  .step .val{width:38px}
}
@media (prefers-reduced-motion:no-preference){.live-dot{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.35}}}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="hdr"></div></header>
<main class="wrap" id="app"><div class="empty">Loading the scoreboard…</div></main>
<div class="toast" id="toast" hidden></div>
<div id="modal"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(() => {
const CFG = window.BLACKLOCK_CONFIG || { firebase: {}, setupPin: "" };
const FORMATS = {
  fourball:   { label: "Fourball",   note: "Each player plays their own ball. Best net score on each hole counts for the pair." },
  foursomes:  { label: "Foursomes",  note: "Partners play one ball, taking alternate shots. One tees off on the odd holes, the other on the even holes." },
  chapman:    { label: "Chapman",    note: "Both drive, swap balls for the second shot, then pick one ball and play alternate shots in." },
  greensomes: { label: "Greensomes", note: "Both drive, pick the better drive, then play alternate shots in." }
};
// Camiral scorecards. Tee ratings and slopes from the club's official slope sheets (camiral.com).
// Check against the card on the day and edit in Setup if needed.
const DEFAULT_EVENT = {
  name: "Blacklock XI",

  if (format === "foursomes") return `Handicaps: each pair gets ${a.foursomes}% of their combined course handicaps; the pair with more gets the difference in shots.`;
  const lo = format === "chapman" ? a.chapLow : a.greenLow, hi = format === "chapman" ? a.chapHigh : a.greenHigh;

      const col = st.leader ? (st.leader === "A" ? "var(--ta)" : "var(--tb)") : "var(--ink)";
      html += `<button class="mrow" data-act="open" data-id="${mid}" aria-label="Match ${m.slot}">
        ${pairCell(m, "a", st)}

  html += `<div class="legend"><span>Numbers in brackets: shots received</span><span>Projected: points if every live match finished as it stands</span></div>`;
  $app.innerHTML = html;
}

// ---------- match view ----------
function firstOpenHole(m){ for (let h = 1; h <= 18; h++) if (!holeResult(m, h)) return h; return 18; }
function renderMatch(){
  const m = getMatch(ui.match), st = matchState(m), p = pillText(st);
  const col = st.leader ? (st.leader === "A" ? "var(--ta)" : "var(--tb)") : "var(--ink)";

    <div class="banner">${pairCell(m, "a", st)}<div class="pill${st.status === "final" ? " fin" : ""}" style="color:${col}">${esc(p.main)}<small>${esc(p.sub)}</small></div>${pairCell(m, "b", st)}</div></div>`;

  const pcard = side => {
    const T = side === "a" ? "A" : "B";

    if (m.format !== "fourball") rows += `<div class="ln"><span>Pair handicap ${fmtHcp(m.ph[side][0])}</span><b class="num">${m.shots[side][0]} shots</b></div>`;
    return `<div class="card"><span class="t" style="color:var(--t${side})">${esc(teamName(T))}</span>${rows}</div>`;
  };
  html += `<div class="pinfo">${pcard("a")}${pcard("b")}</div><p class="hint">Allowance: ${allowTxt}. CH = course handicap${[...m.a, ...m.b].some(id => hcpOverride(id, m.round) != null) ? " (* entered by hand)" : ""}.${m.hcp ? " Handicaps were locked when scoring started." : ""}</p>`;
  if (m.hcp && !setupLocked() && !noDb) {
    const changed = [...m.a, ...m.b].some(id => m.hcp[id] !== roundHcp(id, m.round));
    if (changed) html += `<div class="notice"><b>Handicaps have changed</b> in Setup since this match started. <button class="btn" data-act="refreshhcp" style="margin-left:6px">Use new handicaps</button></div>`;
  }

  const h = ui.hole;
  html += `<div class="hstrip">` + Array.from({ length: 18 }, (_, i) => {
    const r = st.res[i+1], cls = r ? (r.w === "A" ? "wa" : r.w === "B" ? "wb" : "hv") : "";
    return `<button class="${cls}${i+1 === h ? " cur" : ""}" data-act="hole" data-h="${i+1}">${i+1}</button>`;
  }).join("") + `</div>`;

  const si = m.c.si[h-1], par = m.c.par[h-1], s = m.scores[h] || {}, r = st.res[h];
  const ro = noDb;
  html += `<div class="card entry"><div class="ehead"><span class="h">Hole ${h}</span><span class="meta">Par ${par} · SI ${si}</span></div>`;
  if (!ro) html += `<div class="quick" role="group" aria-label="Hole result">
      <button class="qa" data-act="quick" data-w="A" aria-pressed="${s.w === "A"}">${esc(teamName("A"))}<br>win hole</button>

  for (const k of entryKeys(m)) {

    const net = typeof v === "number" && n ? ` · net ${v - n}` : "";
    html += `<div class="erow${r && r.quick ? " muted" : ""}"><span class="stripe" style="background:var(--t${T})"></span>
      <span class="who"><b>${esc(keyLabel(m, k))}</b><small>${n ? `<span class="dots">${"●".repeat(n)}</span> ${n} shot${n > 1 ? "s" : ""}` : "No shot"}${net}</small></span>
      <span class="step">${ro ? "" : `<button data-act="dec" data-k="${k}" aria-label="One less">−</button>`}<span class="val num${v === "x" ? " x" : ""}">${vtxt}</span>${ro ? "" : `<button data-act="inc" data-k="${k}" aria-label="One more">+</button><button class="pu" data-act="pu" data-k="${k}" aria-pressed="${v === "x"}">P/U</button>`}</span></div>`;
  }

    resTxt = (r.w === "H" ? "Hole halved" : `${esc(teamName(r.w))} win the hole`) + standing + (r.quick ? `<br><small class="hint">Result entered directly. Tap it again to go back to strokes.</small>` : "");
  }

    <button class="btn pri" data-act="hole" data-h="${h+1}" ${h === 18 ? "disabled" : ""}>Next ›</button></span></div>`;
  if (!ro && Object.keys(s).some(k => s[k] != null)) html += `<button class="btn danger" data-act="clearhole" style="justify-self:start">Clear hole ${h}</button>`;

function scorecard(m, st){
  const H = Array.from({ length: 18 }, (_, i) => i + 1);
  const head = `<tr><th>Hole</th>${H.map(h => `<th class="${h === ui.hole ? "cur" : ""}" data-act="hole" data-h="${h}" style="cursor:pointer">${h}</th>`).join("")}<th class="tot">Tot</th></tr>`;
  const par = `<tr><td class="lbl">Par</td>${H.map(h => `<td>${m.c.par[h-1]}</td>`).join("")}<td class="tot">${sum(m.c.par)}</td></tr>`;
  const si = `<tr><td class="lbl">SI</td>${H.map(h => `<td>${m.c.si[h-1]}</td>`).join("")}<td class="tot"></td></tr>`;
  const rows = entryKeys(m).map(k => {
    let tot = 0, any = false;
    const cells = H.map(h => {
      const v = (m.scores[h] || {})[k], n = strokesOn(shotsForKey(m, k), m.c.si[h-1]), r = st.res[h];
      if (typeof v === "number") { tot += v; any = true; }
      const counted = m.format === "fourball" && r && (r.ka === k || r.kb === k);
      const txt = v == null || v === "" ? "" : v === "x" ? "–" : v;
      return `<td class="${counted ? "cnt" : ""}">${txt}${n ? `<sup>${"•".repeat(n)}</sup>` : ""}</td>`;
    }).join("");
    return `<tr><td style="border-left:4px solid var(--t${k[0]})">${esc(keyLabel(m, k))}</td>${cells}<td class="tot">${any ? tot : ""}</td></tr>`;
  }).join("");
  const res = `<tr><td class="lbl">Hole won</td>${H.map(h => { const r = st.res[h]; if (!r) return "<td></td>"; return r.w === "H" ? `<td class="rh">½</td>` : `<td class="r${r.w.toLowerCase()}">${esc(teamName(r.w)[0] || r.w)}</td>`; }).join("")}<td class="tot"></td></tr>`;
  const stat = `<tr><td class="lbl">Match</td>${H.map(h => { const a = st.after[h]; if (a == null) return "<td></td>"; return a === 0 ? `<td class="rh">AS</td>` : `<td style="color:var(--t${a > 0 ? "a" : "b"});font-weight:700">${Math.abs(a)}</td>`; }).join("")}<td class="tot"></td></tr>`;
  return `<div class="card"><div class="scroll"><table class="sc"><thead>${head}</thead><tbody>${par}${si}${rows}${res}${stat}</tbody></table></div></div>
    <p class="hint">Dots mark shots received on a hole. ${m.format === "fourball" ? "Underlined scores are the ball that counted. " : ""}– means picked up. A hole result with no strokes was entered directly.</p>`;
}

// ---------- players ----------
function playerRecord(pid){
  const rec = { P: 0, W: 0, H: 0, L: 0, pts: 0, list: [] };
  for (let r = 1; r <= 4; r++) for (const mid of matchIds(r)) {
    const m = getMatch(mid); if (!m.ready) continue;
    const side = m.a.includes(pid) ? "a" : m.b.includes(pid) ? "b" : null; if (!side) continue;
    const st = matchState(m), T = side === "a" ? "A" : "B";
    let out = null;
    if (st.status === "final") { rec.P++; if (!st.leader) { rec.H++; rec.pts += m.r.points / 2; out = "H"; } else if (st.leader === T) { rec.W++; rec.pts += m.r.points; out = "W"; } else { rec.L++; out = "L"; } }
    rec.list.push({ m, st, side, T, out });
  }
  return rec;
}

// ---------- course tab ----------
function fmtIdx1(n){ return n < 0 ? "+" + Math.abs(n).toFixed(1) : n.toFixed(1); }
// Index ranges for each course handicap, laid out like the club's slope sheets.
function chBands(c, t){
  const out = []; let cur = null;
  for (let i = -100; i <= 540; i++) {
    const idx = i / 10, ch = calcHcp(idx, c, t);
    if (cur && cur.ch === ch) cur.to = idx; else { cur = { ch, from: idx, to: idx }; out.push(cur); }
  }
  return out;
}
function ccRows(index){
  if (index == null) return `<p class="hint">Type a handicap index to see the course handicap off every tee.</p>`;

    COURSE_KEYS.map(k => { const c = course(k); return c.tees.map(t => { const ch = calcHcp(index, c, t);

function pairPreview(mid, a, b){

  if (r0.format === "fourball") return "Shots: " + [...a.map((id, i) => `${esc(pname(id))} ${r.shots.a[i]}`), ...b.map((id, i) => `${esc(pname(id))} ${r.shots.b[i]}`)].join(" · ");
  return `Shots: ${esc(teamName("A"))} ${r.shots.a[0]} · ${esc(teamName("B"))} ${r.shots.b[0]}`;

const val = id => document.getElementById(id)?.value ?? "";
async function saveEvent(){

  e.venue = val("e-venue").trim();

  e.rounds = e.rounds.map((r, i) => ({ day: val(`r-day-${i}`).trim(), session: val(`r-ses-${i}`).trim(), format: val(`r-fmt-${i}`), course: val(`r-crs-${i}`), tee: val(`r-tee-${i}`), points: parseFloat(val(`r-pts-${i}`)) || 1 }));

async function saveCourse(){
  if (blocked()) return;
  const e = clone(ev);
  for (const k of COURSE_KEYS) {
    const par = [], si = [];
    for (let i = 0; i < 18; i++) { par.push(parseInt(val(`${k}-par-${i}`)) || 4); si.push(parseInt(val(`${k}-si-${i}`)) || i + 1); }
    if ([...si].sort((x, y) => x - y).some((v, i) => v !== i + 1)) { toast(`${ev.courses[k].name}: stroke index must use each number 1–18 once.`); return; }
    const tees = ev.courses[k].tees.map((t, j) => ({ ...t, name: val(`${k}-tn-${j}`).trim() || t.name, rating: parseFloat(val(`${k}-tr-${j}`)), slope: parseFloat(val(`${k}-ts-${j}`)) }));
    if (tees.some(t => !isFinite(t.rating) || !(t.slope >= 55 && t.slope <= 155))) { toast(`${ev.courses[k].name}: every tee needs a course rating and a slope between 55 and 155.`); return; }
    e.courses[k] = { name: val(`${k}-name`).trim() || ev.courses[k].name, tees, par, si };
  }
  e.allow = { fourball: +val("a-fb") || 90, foursomes: +val("a-fs") || 50, chapLow: +val("a-cl") || 60, chapHigh: +val("a-ch") || 40, greenLow: +val("a-gl") || 60, greenHigh: +val("a-gh") || 40 };
  await writeEvent(e, "Courses saved");
}
async function saveBios(){
  if (blocked()) return;
  const batch = fs.batch(); let n = 0;
  for (const [id, p] of Object.entries(players)) {
    const d = { bio: val("bio-" + id).trim(), caps: val("caps-" + id).trim(), short: val("short-" + id).trim() };
    if (d.bio !== (p.bio || "") || d.caps !== (p.caps || "") || d.short !== (p.short || "")) { batch.update(fs.doc("players/" + id), d); n++; }
  }
  if (!n) { toast("No changes to save"); return; }
  try { await batch.commit(); toast(`Saved ${n} profile${n > 1 ? "s" : ""}`); render(true); } catch (e) { onWriteError(e); }
}
async function saveHcps(){
  if (blocked()) return;
  const batch = fs.batch(); let n = 0, bad = null;
  for (const [id, p] of Object.entries(players)) {
    const ch = {};
    for (let r = 1; r <= 4; r++) { const raw = val(`ch-${id}-${r}`).trim(); if (raw === "") { ch["r" + r] = null; continue; }
      const v = parseIndex(raw); if (v == null) { bad = `${p.name} ${roundLabel(r)}`; continue; } ch["r" + r] = Math.round(v); }
    if (JSON.stringify(ch) !== JSON.stringify(Object.assign({ r1: null, r2: null, r3: null, r4: null }, p.ch || {}))) { batch.update(fs.doc("players/" + id), { ch }); n++; }
  }
  if (bad) { toast(`Couldn't read the handicap for ${bad}.`); return; }
  if (!n) { toast("No changes to save"); return; }
  try { await batch.commit(); toast(`Saved course handicaps for ${n} player${n > 1 ? "s" : ""}`); render(true); } catch (e) { onWriteError(e); }
}

function csvCell(v){
  if (v == null) return "";

  return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
function toCsv(rows){ return "\ufeff" + rows.map(r => r.map(csvCell).join(",")).join("\r\n"); }
function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

function readyMatches(){ const out = []; for (let r = 1; r <= 4; r++) for (const mid of matchIds(r)) { const m = getMatch(mid); if (m.ready) out.push(m); } return out; }
function basisText(m){

    `${A} player 1`, `${A} player 2`, `${B} player 1`, `${B} player 2`,
    `${A} course hcp 1`, `${A} course hcp 2`, `${B} course hcp 1`, `${B} course hcp 2`,
    "Handicap basis", `${A} shots 1`, `${A} shots 2`, `${B} shots 1`, `${B} shots 2`,
    "Status", "Result", "Winner", `${A} points`, `${B} points`, "Holes played"];
  const rows = readyMatches().map(m => {
    const st = matchState(m), pts = matchPoints(m, st, false), fin = st.status === "final";
    const sh = side => m.format === "fourball" ? m.shots[side] : [m.shots[side][0], ""];
    return [ev.name, ev.year, m.round, m.r.day, m.r.session, FORMATS[m.format].label, m.c.name, teeShort(m.tee), m.slot, m.r.points,
      ...m.a.map(pname), ...m.b.map(pname), ...m.ch.a, ...m.ch.b,
      basisText(m), ...sh("a"), ...sh("b"),
      fin ? "Final" : st.status === "live" ? "In progress" : "Not started",
      st.status === "notstarted" ? "" : fin ? st.text : `${st.text} thru ${st.played}`,
      fin ? (st.leader ? teamName(st.leader) : "Halved") : "",
      fin ? pts.A : "", fin ? pts.B : "", st.played];
  });
  download(`${fileBase()}-matches.csv`, toCsv([head, ...rows]), "text/csv;charset=utf-8");
  toast(`Downloaded ${rows.length} match${rows.length === 1 ? "" : "es"}`);
}
function exportHoles(){
  const A = teamName("A"), B = teamName("B");
  const head = ["Event", "Year", "Round", "Format", "Course", "Tees", "Match", `${A} players`, `${B} players`, "Hole", "Par", "SI",
    `${A} strokes 1`, `${A} strokes 2`, `${B} strokes 1`, `${B} strokes 2`,
    `${A} shots on hole 1`, `${A} shots on hole 2`, `${B} shots on hole 1`, `${B} shots on hole 2`,
    "Entered as", "Hole won by", "Match after hole"];
  const rows = [];
  for (const m of readyMatches()) {
    const st = matchState(m), four = m.format === "fourball";
    for (let h = 1; h <= 18; h++) {
      const s = m.scores[h] || {}, r = st.res[h];
      if (!r && !Object.values(s).some(v => v != null && v !== "")) continue;
      const si = m.c.si[h-1], keys = four ? ["a0", "a1", "b0", "b1"] : ["a", null, "b", null];
      const after = st.after[h];
      rows.push([ev.name, ev.year, m.round, FORMATS[m.format].label, m.c.name, teeShort(m.tee), m.slot, m.a.map(pname).join(" & "), m.b.map(pname).join(" & "), h, m.c.par[h-1], si,
        ...keys.map(k => k ? strokeText(s[k]) : ""),
        ...keys.map(k => k ? strokesOn(shotsForKey(m, k), si) : ""),
        r ? (r.quick ? "Result" : "Strokes") : "",
        r ? (r.w === "H" ? "Halved" : teamName(r.w)) : "",
        after == null ? "" : after === 0 ? "All square" : `${teamName(after > 0 ? "A" : "B")} ${Math.abs(after)} up`]);
    }
  }
  download(`${fileBase()}-holes.csv`, toCsv([head, ...rows]), "text/csv;charset=utf-8");
  toast(`Downloaded ${rows.length} hole${rows.length === 1 ? "" : "s"}`);
}
function exportPlayers(){
  const head = ["Event", "Year", "Name", "Team", "Captain", "Caps", "Handicap index",
    ...[1, 2, 3, 4].map(n => `${roundLabel(n)} course hcp`), "Matches", "Finished", "Won", "Halved", "Lost", "Points won"];
  const rows = sortedPlayers().map(([id, p]) => { const r = playerRecord(id);
    return [ev.name, ev.year, p.name, teamName(p.team), p.captain ? "Yes" : "", p.caps || "", p.index,
      ...[1, 2, 3, 4].map(n => roundHcp(id, n)), r.list.length, r.P, r.W, r.H, r.L, r.pts]; });
  download(`${fileBase()}-players.csv`, toCsv([head, ...rows]), "text/csv;charset=utf-8");
  toast(`Downloaded ${rows.length} players`);
}
function exportBackup(){
  const data = { app: "blacklock-xi", version: 1, exportedAt: new Date().toISOString(), event: ev, players, matches };
  download(`${fileBase()}-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 2), "application/json");
  toast("Backup downloaded");
}
let restoreData = null, restoreArmed = false;
function readRestoreFile(file){
  const info = document.getElementById("restore-info"), btn = document.getElementById("restore-btn");
  restoreData = null; btn.disabled = true;
  if (!file) { info.textContent = ""; return; }
  file.text().then(txt => {
    const d = JSON.parse(txt);
    if (d.app !== "blacklock-xi" || !d.event || typeof d.players !== "object" || typeof d.matches !== "object") throw new Error("not a backup");
    restoreData = d; btn.disabled = false;
    const scored = Object.values(d.matches).filter(m => m && m.scores && Object.keys(m.scores).length).length;
    info.textContent = `Backup from ${new Date(d.exportedAt).toLocaleString()}: ${Object.keys(d.players).length} players, ${Object.keys(d.matches).length} matches (${scored} with scores).`;
  }).catch(() => { info.textContent = "That file isn't a Blacklock XI backup."; });
}
async function doRestore(btn){
  if (blocked() || !restoreData) return;
  if (!restoreArmed) { restoreArmed = true; btn.textContent = "Tap again to replace all data"; setTimeout(() => { if (restoreArmed) { restoreArmed = false; btn.textContent = "Restore backup"; } }, 4000); return; }
  restoreArmed = false; btn.textContent = "Restoring…";
  const b = fs.batch(), d = restoreData;
  b.set(fs.doc("event/main"), d.event);
  for (const [id, p] of Object.entries(d.players)) b.set(fs.doc("players/" + id), p);
  for (const id of Object.keys(players)) if (!(id in d.players)) b.delete(fs.doc("players/" + id));
  for (const [id, m] of Object.entries(d.matches)) b.set(fs.doc("matches/" + id), m);
  for (const id of Object.keys(matches)) if (!(id in d.matches)) b.delete(fs.doc("matches/" + id));
  try { await b.commit(); restoreData = null; toast("Backup restored"); render(true); } catch (e) { btn.textContent = "Restore backup"; onWriteError(e); }
}
async function writeEvent(e, msg){
  try { await fs.doc("event/main").set(e); ev = mergeEvent(e); applyTeamColors(); toast(msg); render(true); } catch (err) { onWriteError(err); }
}
function teamFrom(s){
  s = String(s || "").trim().toLowerCase();
  if (s === "1" || s === "a" || s === ev.teams.A.name.toLowerCase()) return "A";
  if (s === "2" || s === "b" || s === ev.teams.B.name.toLowerCase()) return "B";
  return null;
}
async function bulkAdd(){
  if (blocked()) return;
  const lines = val("bulk").split(/\n/).map(l => l.trim()).filter(Boolean);
  const bad = [], ops = [];
  for (const line of lines) {
    const parts = line.split(/[,\t;]/).map(s => s.trim());
    const name = parts[0], team = teamFrom(parts[1]), index = parseIndex(parts[2]);
    if (!name || !team) { bad.push(line); continue; }
    const existing = Object.entries(players).find(([, p]) => p.name.toLowerCase() === name.toLowerCase());
    const id = existing ? existing[0] : "p" + Math.random().toString(36).slice(2, 9);
    const d = { name, team, index }; if (/^c(apt(ain)?)?$/i.test(parts[3] || "")) d.captain = true;
    ops.push([id, d]);
  }
  if (!ops.length) { toast(bad.length ? `Couldn't read: ${bad[0]}` : "Nothing to add."); return; }
  try { const batch = fs.batch(); ops.forEach(([id, d]) => batch.set(fs.doc("players/" + id), d, { merge: true })); await batch.commit();
    toast(`Saved ${ops.length} player${ops.length > 1 ? "s" : ""}${bad.length ? `, skipped ${bad.length}` : ""}`); render(true); }
  catch (e) { onWriteError(e); }
}
async function savePlayers(){
  if (blocked()) return;
  const batch = fs.batch(); let n = 0;
  for (const [id, p] of Object.entries(players)) {
    const d = { name: val("pn-" + id).trim() || p.name, team: val("pt-" + id) || p.team, index: parseIndex(val("pi-" + id)), captain: !!document.getElementById("pc-" + id)?.checked };
    if (d.name !== p.name || d.team !== p.team || d.index !== p.index || d.captain !== !!p.captain) { batch.update(fs.doc("players/" + id), d); n++; }
  }
  if (!n) { toast("No changes to save"); return; }
  try { await batch.commit(); toast(`Updated ${n} player${n > 1 ? "s" : ""}`); render(true); } catch (e) { onWriteError(e); }
}
let delArmed = null;
async function delPlayer(id, btn){
  if (blocked()) return;
  if (delArmed !== id) { delArmed = id; btn.textContent = "Remove?"; setTimeout(() => { if (delArmed === id) { delArmed = null; btn.textContent = "✕"; } }, 3000); return; }
  delArmed = null;
  try { await fs.doc("players/" + id).delete(); toast("Player removed"); render(true); } catch (e) { onWriteError(e); }
}
async function savePairs(){
  if (blocked()) return;
  const batch = fs.batch(); let n = 0;
  for (let r = 1; r <= 4; r++) { const used = new Set();
    for (const mid of matchIds(r)) {
      const a = [val(`pa-${mid}-0`), val(`pa-${mid}-1`)], b = [val(`pb-${mid}-0`), val(`pb-${mid}-1`)];
      for (const id of [...a, ...b]) if (id) { if (used.has(id)) { toast(`${pname(id)} is in two matches in round ${r}.`); return; } used.add(id); }
      const cur = matches[mid];
      if (cur && JSON.stringify(cur.a || []) === JSON.stringify(a) && JSON.stringify(cur.b || []) === JSON.stringify(b)) continue;
      if (cur) batch.update(fs.doc("matches/" + mid), { a, b, hcp: null });
      else batch.set(fs.doc("matches/" + mid), { round: r, a, b, scores: {} });
      n++;
    }
  }
  if (!n) { toast("No changes to save"); return; }
  try { await batch.commit(); toast(`Saved ${n} pairing${n > 1 ? "s" : ""}`); render(true); } catch (e) { onWriteError(e); }
}

// ---------- render & events ----------
function render(force){
  applyTeamColors();
  renderHeader();
  renderModal();
  if (ui.tab === "course" && !force && $app.dataset.view === "course") return;
  if (ui.tab === "setup" && !force && $app.dataset.view === "setup" && setupDirty) return; // don't wipe half-typed setup forms on live updates
  $app.dataset.view = ui.tab;
  setupDirty = false;
  if (ui.tab === "board") ui.match ? renderMatch() : renderBoard();
  else if (ui.tab === "players") renderPlayers();
  else if (ui.tab === "shots") renderShots();
  else if (ui.tab === "course") renderCourse();
  else renderSetup();
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, m = ui.match ? getMatch(ui.match) : null;
  switch (act) {
    case "tab": ui.tab = el.dataset.tab; if (ui.tab === "board") ui.match = null; if (ui.tab === "players") ui.player = null; saveUi(); render(true); scrollTo(0, 0); break;
    case "open": ui.tab = "board"; ui.match = el.dataset.id; ui.hole = firstOpenHole(getMatch(ui.match)); saveUi(); render(true); scrollTo(0, 0); break;
    case "close": ui.match = null; saveUi(); render(true); break;
    case "player": ui.profile = null; ui.tab = "players"; ui.player = el.dataset.id || null; saveUi(); render(true); scrollTo(0, 0); break;
    case "profile": ui.profile = el.dataset.id; renderModal(); document.querySelector(".sheet .x")?.focus(); break;
    case "closeprofile": if (e.target === el || el.classList.contains("x")) { ui.profile = null; ui.scores = false; renderModal(); } break;
    case "scores": ui.scores = true; renderModal(); document.querySelector(".sheet .x")?.focus(); break;
    case "savebios": saveBios(); break;
    case "hole": { const h = +el.dataset.h; if (h >= 1 && h <= 18) { ui.hole = h; render(); } break; }
    case "inc": case "dec": case "pu": {
      const k = el.dataset.k, cur = (m.scores[ui.hole] || {})[k], par = m.c.par[ui.hole - 1];
      let v;
      if (act === "pu") v = cur === "x" ? null : "x";
      else if (typeof cur !== "number") v = par;
      else v = Math.max(1, Math.min(15, cur + (act === "inc" ? 1 : -1)));
      queueScore(ui.match, String(ui.hole), k, v); break;
    }
    case "clearhole": { for (const k of [...entryKeys(m), "w"]) queueScore(ui.match, String(ui.hole), k, null); break; }
    case "quick": { const cur = (m.scores[ui.hole] || {}).w; queueScore(ui.match, String(ui.hole), "w", cur === el.dataset.w ? null : el.dataset.w); break; }
    case "unlock": pinMatches(val("pin")).then(ok => { if (ok) { ui.unlocked = true; saveUi(); render(true); } else toast("That PIN isn't right."); }); break;
    case "lock": ui.unlocked = false; saveUi(); render(true); toast("Setup locked on this phone"); break;
    case "saveevent": saveEvent(); break;
    case "savehcps": saveHcps(); break;
    case "refreshhcp": if (!blocked()) fs.doc("matches/" + ui.match).update({ hcp: null }).then(() => toast("Match now uses the new handicaps"), onWriteError); break;
    case "savecourse": saveCourse(); break;
    case "bulkadd": bulkAdd(); break;
    case "saveplayers": savePlayers(); break;
    case "delplayer": delPlayer(el.dataset.id, el); break;
    case "savepairs": savePairs(); break;
    case "exportmatches": exportMatches(); break;
    case "exportholes": exportHoles(); break;
    case "exportplayers": exportPlayers(); break;
    case "exportbackup": exportBackup(); break;
    case "restore": doRestore(el); break;
  }
});
let setupDirty = false;
document.addEventListener("input", e => { if (e.target.id === "cc-index") { ui.cc = { index: e.target.value }; saveUi(); document.getElementById("cc-out").innerHTML = ccRows(parseIndex(e.target.value)); } });
document.addEventListener("input", e => { if (ui.tab === "setup" && e.target.closest("main")) setupDirty = true; });
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "restore-file") { readRestoreFile(t.files[0]); return; }
  if (ui.tab === "setup" && t.closest("main")) setupDirty = true;
  if (t.id && t.id.startsWith("c-") && ui.tab === "shots") {
    const c = ui.calc;
    if (t.id === "c-format") c.format = t.value; else if (t.id === "c-round") c.round = +t.value; else { const s = t.id[2], i = +t.id[3]; c[s][i] = t.value; }
    saveUi(); render(true);
  }
  if (t.id && t.id.startsWith("r-crs-")) {
    const i = t.id.slice(6), sel = document.getElementById("r-tee-" + i), c = course(t.value);
    sel.innerHTML = c.tees.map(x => `<option value="${esc(x.id)}" ${x === defTee(c) ? "selected" : ""}>${esc(teeShort(x))}</option>`).join("");
  }
  if (t.dataset.mid && ui.tab === "setup") {
    const mid = t.dataset.mid;
    const a = [val(`pa-${mid}-0`), val(`pa-${mid}-1`)], b = [val(`pb-${mid}-0`), val(`pb-${mid}-1`)];
    document.getElementById("prev-" + mid).innerHTML = pairPreview(mid, a, b);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && (ui.profile || ui.scores)) { ui.profile = null; ui.scores = false; renderModal(); }
  if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.act === "scores") { e.preventDefault(); e.target.click(); }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "pin") document.querySelector('[data-act="unlock"]')?.click(); });

// ---------- boot ----------
if (!["board","players","shots","course","setup"].includes(ui.tab)) ui.tab = "board";
if (ui.match && !/^r[1-4]m[1-4]$/.test(ui.match)) ui.match = null;
if (ui.match) ui.hole = 1;
render(true);

try {
  if (!window.firebase || !CFG.firebase || !CFG.firebase.projectId) throw new Error("Firebase not configured");
  firebase.initializeApp(CFG.firebase);
  fs = firebase.firestore();
  fs.doc("event/main").onSnapshot(s => { ev = mergeEvent(s.exists ? s.data() : null); loaded.ev = true; render(); }, err => console.error(err));
  fs.collection("players").onSnapshot(s => { players = {}; s.docs.forEach(d => players[d.id] = d.data()); loaded.p = true; render(); }, err => console.error(err));
  fs.collection("matches").onSnapshot(s => { matches = {}; s.docs.forEach(d => matches[d.id] = d.data());
    if (!loaded.m && ui.match) ui.hole = firstOpenHole(getMatch(ui.match));
    loaded.m = true; render(); }, err => console.error(err));
} catch (e) { console.warn(e.message); noDb = true; render(true); }
})();
</script>
</body>
