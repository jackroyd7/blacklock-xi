<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4f91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blacklock XI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<title>Blacklock XI</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky team scoreboard header, then one column of round boards (Blacklock manual-board style), phone first. */
:root{
  color-scheme:light;
  --bg:#eef2ec; --surface:#ffffff; --surface2:#f6f8f4; --ink:#14201a; --muted:#5a6a60; --line:#d6ddd3;
  --accent:#1e6b45; --warn:#9a6a00; --warn-bg:#fff4d6; --bad:#b3261e;
  --ta:#1d4f91; --tb:#b42335; --on-team:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0c130f; --surface:#141e18; --surface2:#1a261f; --ink:#e5ece6; --muted:#93a399; --line:#27352d;
  --accent:#5cc28c; --warn:#f2c14e; --warn-bg:#33290f; --bad:#ff8a80; color-scheme:dark }}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:10px 0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.evline{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 12px}
.evname{font-family:var(--display);font-weight:700;font-size:1.35rem;letter-spacing:.02em;text-transform:uppercase;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evname small{font-family:var(--body);font-weight:500;font-size:.75rem;color:var(--muted);text-transform:none;letter-spacing:0;margin-left:6px}
.evmeta{font-size:.78rem;color:var(--muted);white-space:nowrap;flex-shrink:0}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:1px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:4px;border-radius:var(--r);overflow:hidden;cursor:pointer}
.board:hover .big{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.modal.centre{align-items:center;padding:12px}
.scard{max-width:420px;border-radius:16px!important;max-height:calc(100% - 24px)!important;text-align:center}
.scard .top{position:relative;color:var(--on-team);background:linear-gradient(90deg,var(--ta) 50%,var(--tb) 50%);padding:16px 14px 14px;display:grid;gap:4px;justify-items:center}
.scard .top .x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:var(--on-team);font-size:1rem}
.scard .crest{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);margin-bottom:2px}
.scard .ev{font-weight:600;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.scard .totals{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;width:100%}
.scard .totals .tn{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase}
.scard .totals .tn.a{text-align:right} .scard .totals .tn.b{text-align:left}
.scard .totals .big2{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.scard .sub2{font-size:.74rem;opacity:.9}
.scard .rounds{padding:6px 14px 10px}
.scard .rr{display:grid;gap:3px;justify-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.scard .rr:last-child{border-bottom:0}
.scard .rn{font-family:var(--display);font-weight:700;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scard .sc2{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:.9rem;white-space:nowrap}
.scard .sc2 .tl{width:5.8rem;overflow:hidden;text-overflow:ellipsis} .scard .sc2 .tl.a{text-align:right} .scard .sc2 .tl.b{text-align:left}
.scard .sc2 .chip{font-family:var(--display);font-size:1.25rem;min-width:2.1em;padding:1px 6px}
.scard .rd{color:var(--muted);font-size:.72rem}
.scard .foot{font-size:.7rem;color:var(--muted);padding:0 14px 12px}
.side{color:var(--on-team);padding:8px 12px;display:grid;grid-template-columns:1fr auto;align-items:end;min-width:0}
.side.a{background:var(--ta)} .side.b{background:var(--tb);grid-template-columns:auto 1fr;text-align:right}
.tname{font-family:var(--display);font-weight:600;font-size:1rem;text-transform:uppercase;letter-spacing:.06em;line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj{display:block;font-family:var(--body);font-size:.72rem;opacity:.85;text-transform:none;letter-spacing:0;font-weight:500}
.big{font-family:var(--display);font-weight:700;font-size:3rem;line-height:.9;font-variant-numeric:tabular-nums}
.bar{position:relative;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0}
.bar .mid{left:50%;width:2px;margin-left:-1px;background:var(--ink);opacity:.5}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;border:0;background:none;padding:10px 12px;font-weight:600;font-size:.88rem;color:var(--muted);border-bottom:3px solid transparent}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

main.wrap{padding-block:16px 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.mhead,.entry,.pinfo{min-width:0}
.pinfo{grid-template-columns:repeat(2,minmax(0,1fr))}
.notice{background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn);border-radius:var(--r);padding:10px 12px;font-size:.88rem}
.notice b{color:var(--warn)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted)}

.round{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2)}
.rhead h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.25rem;text-transform:uppercase;letter-spacing:.04em}
.rhead .sub{color:var(--muted);font-size:.8rem;flex-basis:100%;order:2;min-width:0}
.rhead .rule{flex-basis:100%;order:3;color:var(--muted);font-size:.74rem;line-height:1.35;max-width:65ch}
.rhead .rscore{order:1;margin-left:auto}
.rscore{font-family:var(--display);font-weight:700;font-size:1.15rem;display:flex;gap:6px;align-items:center}
.chip{display:inline-block;min-width:1.9em;text-align:center;padding:0 6px;border-radius:5px;color:var(--on-team);font-variant-numeric:tabular-nums}
.mrow{display:grid;grid-template-columns:1fr 92px 1fr;align-items:stretch;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:0;text-align:left}
.mrow:first-of-type{border-top:0}
.pair{padding:9px 10px;display:grid;gap:1px;min-width:0;font-weight:600;font-size:.9rem;line-height:1.25}
.pair span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pair small{font-weight:500;color:var(--muted);font-size:.72rem}
.pair.b{text-align:right}
.pair.lead{color:var(--on-team)} .pair.lead small{color:var(--on-team);opacity:.8}
.pair.a.lead{background:var(--ta)} .pair.b.lead{background:var(--tb)}
.pill{display:grid;place-content:center;text-align:center;font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1;padding:6px 2px;background:var(--surface2);border-inline:1px solid var(--line)}
.pill small{display:block;font-family:var(--body);font-weight:500;font-size:.68rem;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
.pill.fin small{color:var(--ink)}
.tbc{color:var(--muted);font-weight:500;font-style:italic}

.back{border:0;background:none;color:var(--accent);font-weight:600;padding:0;justify-self:start}
.mhead{display:grid;gap:10px}
.mtitle{font-family:var(--display);font-weight:700;font-size:1.4rem;text-transform:uppercase;letter-spacing:.03em;margin:0}
.banner{display:grid;grid-template-columns:1fr auto 1fr;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.banner .pair{padding:10px 12px}
.banner .pill{min-width:96px;font-size:1.6rem}
.hstrip{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.hstrip button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 0;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.hstrip button.wa{background:var(--ta);color:var(--on-team);border-color:transparent}
.hstrip button.wb{background:var(--tb);color:var(--on-team);border-color:transparent}
.hstrip button.hv{background:var(--surface2);color:var(--muted)}
.hstrip button.cur{outline:3px solid var(--ink);outline-offset:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.entry{padding:12px;display:grid;gap:10px}
.ehead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ehead .h{font-family:var(--display);font-weight:700;font-size:1.8rem;line-height:1}
.ehead .meta{color:var(--muted);font-size:.85rem}
.erow{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center}
.erow .stripe{align-self:stretch;border-radius:2px}
.erow .who{min-width:0}
.erow .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .who small{color:var(--muted);font-size:.75rem}
.dots{color:var(--accent);letter-spacing:1px;font-size:.8rem}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-size:1.3rem;font-weight:600;line-height:1}
.step .val{width:46px;text-align:center;font-family:var(--display);font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums}
.step .val.x{font-size:1rem}
.step .pu{width:auto;border-radius:22px;padding:0 10px;font-size:.78rem;font-weight:700}
.step .pu[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.quick{display:grid;grid-template-columns:1fr auto 1fr;gap:6px}
.quick button{border:2px solid var(--line);background:var(--surface2);border-radius:8px;padding:10px 6px;font-weight:700;font-size:.88rem;line-height:1.15}
.quick button.qa{border-color:var(--ta);color:var(--ta)} .quick button.qb{border-color:var(--tb);color:var(--tb)}
.quick button.qa[aria-pressed="true"]{background:var(--ta);color:var(--on-team)}
.quick button.qb[aria-pressed="true"]{background:var(--tb);color:var(--on-team)}
.quick button.qh[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.orline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
.orline::before,.orline::after{content:"";flex:1;border-top:1px solid var(--line)}
.erow.muted{opacity:.45}
.efoot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.efoot .res{font-weight:600;font-size:.9rem;flex:1;min-width:140px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:9px 14px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.pinfo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pinfo .card{padding:10px 12px;font-size:.85rem;display:grid;gap:4px}
.pinfo .card .t{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pinfo .ln{display:flex;justify-content:space-between;gap:8px}
.pinfo .ln span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:.84rem;font-variant-numeric:tabular-nums}
.sc th,.sc td{border:1px solid var(--line);padding:5px 6px;text-align:center;min-width:30px}
.sc th:first-child,.sc td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);min-width:96px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;z-index:1}
.sc thead th{background:var(--surface2);font-weight:700}
.sc .tot{background:var(--surface2);font-weight:700}
.sc td.cnt{font-weight:800;text-decoration:underline;text-underline-offset:3px}
.sc td.ra{background:var(--ta);color:var(--on-team)} .sc td.rb{background:var(--tb);color:var(--on-team)}
.sc td.rh{color:var(--muted)}
.sc sup{color:var(--accent);font-size:.6rem;margin-left:1px}
.sc th.cur{outline:2px solid var(--ink);outline-offset:-2px}
.sc .lbl{color:var(--muted);font-weight:600}
.list th,.list td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.list th:first-child,.list td:first-child{text-align:left}
.list thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
/* Players tab: long names wrap so every column fits on a phone */
.ptable td:first-child{white-space:normal;overflow-wrap:anywhere;line-height:1.25}
@media (max-width:520px){.ptable th,.ptable td{padding:7px 4px}.ptable th:first-child,.ptable td:first-child{padding-left:8px}.ptable th:last-child,.ptable td:last-child{padding-right:8px}.ptable{font-size:.8rem}}
.list tr.click{cursor:pointer} .list tr.click:hover td{background:var(--surface2)}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px}
.teamcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.teamcard h3{margin:0;padding:8px 12px;color:var(--on-team);font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:1.1rem}
h2.sec{font-family:var(--display);font-weight:700;font-size:1.25rem;text-transform:uppercase;letter-spacing:.04em;margin:0}
p.lead{margin:0;color:var(--muted);max-width:65ch}

.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.form h3{margin:0;font-family:var(--display);font-weight:700;font-size:1.15rem;text-transform:uppercase;letter-spacing:.04em}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label.f{display:grid;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=number],input[type=password],input[type=time],select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:var(--surface2);padding:8px 9px;font-size:.95rem;min-width:0}
/* iPhones zoom the page when a text box under 16px is tapped, and the zoom then crops full-screen views */
@media (pointer:coarse){input[type=text],input[type=number],input[type=password],input[type=time],select,textarea{font-size:16px}}
input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:7px;background:var(--surface2);padding:2px}
textarea{min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
.holes{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.holes .hc{display:grid;gap:3px;text-align:center;font-size:.72rem;color:var(--muted);font-weight:700}
.holes input{padding:6px 2px;text-align:center}
.pairrow{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.pairrow .mn{font-family:var(--display);font-weight:700;font-size:1.1rem;grid-row:span 2}
.pairrow .ps{display:grid;gap:4px;min-width:0;border-left:4px solid;padding-left:8px}
.pairrow .prev{grid-column:2/4;font-size:.78rem;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr 110px 72px 58px auto;gap:6px;align-items:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{font-size:.8rem;color:var(--muted);margin:0}
.net{font-size:.78rem;font-weight:600;padding:5px 10px;border-radius:8px;background:var(--surface2);color:var(--muted)}
.net.off{background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn)}
.update{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:12px;font-size:.88rem;font-weight:600;max-width:520px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.88rem;font-weight:600;z-index:50;max-width:calc(100% - 32px)}
.capt{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;font-size:.68rem;font-weight:800;letter-spacing:.04em;color:var(--on-team);vertical-align:2px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,16,12,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:100%;max-width:480px;max-height:calc(100% - 32px);overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.sheet header{color:var(--on-team);padding:16px 18px 14px;display:grid;gap:2px;position:relative}
.sheet header h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.8rem;line-height:1;text-transform:uppercase;letter-spacing:.03em;padding-right:36px}
.sheet header .x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:var(--on-team);font-size:1.2rem}
.sheet .body{padding:16px 18px 18px;display:grid;gap:12px}
.sheet .bio{white-space:pre-line;line-height:1.55;max-width:65ch}
.sheet .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.sheet .stats div{background:var(--surface2);border-radius:8px;padding:6px 2px;font-size:.72rem;color:var(--muted)}
.sheet .stats b{display:block;font-family:var(--display);font-size:1.35rem;color:var(--ink)}
@media (max-width:520px){.modal{align-items:flex-end;padding:0}.sheet{border-radius:14px 14px 0 0;max-height:88%;padding-bottom:env(safe-area-inset-bottom,0px)}}
.unit{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.unit button{border:0;background:var(--surface);padding:6px 12px;font-weight:600;font-size:.82rem;color:var(--muted)}
.unit button[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.bands{columns:3 9rem;column-gap:18px;font-size:.8rem;font-variant-numeric:tabular-nums}
.bands div{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px solid var(--line);break-inside:avoid}
.bands b{font-family:var(--display);font-size:.95rem}
details.tee{border-top:1px solid var(--line);padding-block:8px}
details.tee summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
details.tee summary span{color:var(--muted);font-weight:500;font-size:.85rem}
.ccbig{font-size:1.4rem;max-width:12rem;font-family:var(--display);font-weight:700}
.sc .tee td:first-child{font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}

/* Hole maps: a satellite photo turned so the tee is at the bottom and the green at the top. */

.hm{touch-action:none}

.hmmap .attr{position:absolute;right:4px;bottom:2px;font-size:.6rem;opacity:.7;pointer-events:none}

const COURSE_KEYS = ["tour", "stadium"];

let fs = null, noDb = false;

  calc: { format: "fourball", round: 1, a: ["", ""], b: ["", ""] } }, loadUi());

const $hdr = document.getElementById("hdr"), $app = document.getElementById("app"), $toast = document.getElementById("toast");

// ---------- helpers ----------
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function half(n){ const w = Math.floor(n), h = Math.abs(n - w) > 0.01; return (w === 0 && h) ? "½" : (w + (h ? "½" : "")); }
function sum(a){ return a.reduce((s, x) => s + (+x || 0), 0); }

function mergeEvent(d){

function parseIndex(s){ s = String(s ?? "").trim(); if (s === "") return null; const plus = s.startsWith("+"); const n = parseFloat(s.replace("+","")); return isFinite(n) ? (plus ? -n : n) : null; }

  return `<div class="card"><div class="scroll"><table class="sc"><thead>${head}</thead><tbody>${par}${si}${rows}${res}${stat}</tbody></table></div></div>
    <p class="hint">Dots mark shots received on a hole. ${m.format === "fourball" ? "Underlined scores are the ball that counted. " : ""}– means picked up. A hole result with no strokes was entered directly.</p>`;

// ---------- players ----------
function playerRecord(pid){
  const rec = { P: 0, W: 0, H: 0, L: 0, pts: 0, list: [] };
  for (let r = 1; r <= 4; r++) for (const mid of matchIds(r)) {
    const m = getMatch(mid); if (!m.ready) continue;
    const side = m.a.includes(pid) ? "a" : m.b.includes(pid) ? "b" : null; if (!side) continue;
    const st = matchState(m), T = side === "a" ? "A" : "B";
    let out = null;
    if (st.status === "final") { rec.P++; if (!st.leader) { rec.H++; rec.pts += m.r.points / 2; out = "H"; } else if (st.leader === T) { rec.W++; rec.pts += m.r.points; out = "W"; } else { rec.L++; out = "L"; } }
    rec.list.push({ m, st, side, T, out });
  }
  return rec;
}

      return `<tr class="click" data-act="profile" data-id="${id}"><td>${esc(p.name)}${captBadge(p)}</td><td>${fmtIndex(p.index)}</td>${[1,2,3,4].map(n => `<td>${fmtHcp(roundHcp(id, n))}${hcpOverride(id, n) != null ? "*" : ""}</td>`).join("")}<td>${r.W}-${r.H}-${r.L}</td><td><b>${half(r.pts)}</b></td></tr>`; }).join("");

function fmtIdx1(n){ return n < 0 ? "+" + Math.abs(n).toFixed(1) : n.toFixed(1); }

// ---------- hole maps ----------
// Each mapped hole stores points as [lat, lng] in the event document, under courses.<key>.geo.<hole>:
// t tee, g middle of the green, and optionally f front, b back, d dogleg (the corner the line bends round).
const TILE_URL = (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
const TILE_ATTR = "Imagery © Esri, Maxar, Earthstar Geographics";
const MAX_Z = 19, NEAR = 600; // metres from the green within which GPS distances are shown
const GEO_START = [41.866, 2.767]; // roughly Camiral, for the editor's first view
function holeGeo(k, h){ const g = (course(k).geo || {})[h]; return g && g.t && g.g ? g : null; }
function mappedCount(k){ let n = 0; for (let h = 1; h <= 18; h++) if (holeGeo(k, h)) n++; return n; }
function metres(a, b){
  const r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371000 * Math.asin(Math.sqrt(x));
}
// Along the line of play: via the dogleg when there is one.
function viaLen(g, p){ return g.d ? metres(g.t, g.d) + metres(g.d, p) : metres(g.t, p); }
function wpx(p, z){ const s = 256 * 2 ** z, sin = Math.sin(p[0] * Math.PI / 180); return [(p[1] + 180) / 360 * s, (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * s]; }
function wll(x, y, z){ const s = 256 * 2 ** z, n = Math.PI - 2 * Math.PI * y / s; return [180 / Math.PI * Math.atan(Math.sinh(n)), x / s * 360 - 180]; }
function rot(x, y, a){ return [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)]; }
function D(m){ return dist(Math.round(m)); }
function farTxt(m){ return m >= 1000 ? `${(m / 1000).toFixed(1)} km` : `${D(m)} ${unitLabel()}`; }

// GPS runs only while a hole map or a match's scoring screen is open, and stops when the app is in the background.
const gps = { watch: null, pos: null, acc: null, err: null };
function gpsWanted(){ return !!ui.gps && document.visibilityState === "visible" && (hm.open || (ui.tab === "board" && !!ui.match)); }
function gpsSync(){
  if (!navigator.geolocation) { if (ui.gps) gps.err = "This browser can't share its location."; return; }
  if (gpsWanted() && gps.watch == null) {
    gps.watch = navigator.geolocation.watchPosition(
      p => { gps.pos = [p.coords.latitude, p.coords.longitude]; gps.acc = p.coords.accuracy; gps.err = null; gpsUpdate(); },
      e => { gps.err = e.code === 1 ? "Location is blocked for this site. Allow it in your phone's browser settings." : "Can't get a GPS fix yet."; gpsUpdate(); },
      { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 });
  } else if (!gpsWanted() && gps.watch != null) { navigator.geolocation.clearWatch(gps.watch); gps.watch = null; }
}
function gpsSet(on){ ui.gps = on; saveUi(); if (!on) { gps.pos = null; gps.err = null; } gpsSync(); gpsUpdate(); }
function gpsUpdate(){
  document.querySelectorAll("[data-gps]").forEach(el => el.innerHTML = gpsLine(el.dataset.gps, +el.dataset.h));
  if (hm.open) { hmOverlay(); hmBottom(); }

  geRemember(); delete ge.pts[ge.mode]; ge.dirty = true; geDraw();
}
function geHole(h){
  ge.h = h; ge.pts = clone((course(ge.k).geo || {})[h] || {}); ge.dirty = false; ge.hist = [];
  ge.mode = !ge.pts.t ? "t" : !ge.pts.g ? "g" : "f";
  const pts = Object.values(ge.pts), prev = holeGeo(ge.k, h - 1), all = [];
  for (let i = 1; i <= 18; i++) { const g = holeGeo(ge.k, i); if (g) all.push(g.t, g.g); }
  if (pts.length >= 2) ge.map.fitBounds(pts, { padding: [40, 40], maxZoom: 19 });
  else if (pts.length) ge.map.setView(pts[0], 18);
  else if (prev) ge.map.setView(prev.g, 17);
  else if (all.length) ge.map.fitBounds(all, { padding: [20, 20] });
  else ge.map.setView(GEO_START, 15);
  geDraw();
}
function geStrip(){
  const el = document.getElementById("ge-holes"); if (!el) return;
  el.innerHTML = Array.from({ length: 18 }, (_, i) => `<button class="${holeGeo(ge.k, i + 1) ? "ok" : ""}${i + 1 === ge.h ? " cur" : ""}" data-act="gehole" data-h="${i + 1}" aria-label="Hole ${i + 1}">${i + 1}</button>`).join("");
}
function geDraw(){
  if (!ge.map) return;
  const L = window.L, p = ge.pts;
  ge.layer.clearLayers();
  for (let i = 1; i <= 18; i++) { const g = holeGeo(ge.k, i); if (!g || i === ge.h) continue;
    L.polyline([g.t, g.d, g.g].filter(Boolean), { color: "#fff", weight: 2, opacity: .55, dashArray: "4 6", interactive: false }).addTo(ge.layer)
      .bindTooltip(String(i), { permanent: true, direction: "center", className: "" }); }
  if (p.t && p.g) L.polyline([p.t, p.d, p.g].filter(Boolean), { color: "#fff", weight: 3, interactive: false }).addTo(ge.layer);
  for (const [k, , col] of GE_MODES) if (p[k]) {
    const icon = L.divIcon({ className: "", iconSize: [26, 26], iconAnchor: [13, 13],
      html: `<div style="width:26px;height:26px;border-radius:50%;background:${col};border:2px solid #000;display:grid;place-content:center;font:700 12px sans-serif;color:#000">${k.toUpperCase()}</div>` });
    // Tap a marker to select it (then Remove point deletes it); drag it to move it.
    L.marker(p[k], { icon, draggable: true }).addTo(ge.layer)
      .on("click", () => { ge.mode = k; geDraw(); })
      .on("dragstart", geRemember)
      .on("dragend", e => { const ll = e.target.getLatLng(); ge.pts[k] = [ll.lat, ll.lng]; ge.dirty = true; ge.mode = k; geDraw(); });
  }
  geStrip();
  document.getElementById("ge-modes").innerHTML = GE_MODES.map(([k, label]) => `<button data-act="gemode" data-m="${k}" aria-pressed="${ge.mode === k}" class="${p[k] ? "set" : ""}">${label}</button>`).join("");
  const label = GE_MODES.find(x => x[0] === ge.mode)[1].toLowerCase();
  document.getElementById("ge-hint").textContent = `Hole ${ge.h}: tap the map to place the ${label}. Drag a marker to move it, or tap it and use Remove. Undo steps back through your changes. Tee and green middle are needed; front, back and dogleg are optional. Put the tee on the tee box used for the rounds.`;
  const undo = document.getElementById("ge-undo"), rem = document.getElementById("ge-remove");
  if (undo) undo.disabled = !ge.hist.length;
  if (rem) { rem.disabled = !p[ge.mode]; rem.textContent = `Remove ${label}`; }
  const c = course(ge.k), tee = defTee(c);
  document.getElementById("ge-info").textContent = p.t && p.g
    ? `Tee to middle ${Math.round(viaLen(p, p.g))} m (${Math.round(viaLen(p, p.g) * 1.09361)} yd). Card, tee ${tee.id}: ${tee.m ? tee.m[ge.h - 1] + " m" : "–"}.${ge.dirty ? " Not saved yet." : ""}`
    : `Par ${c.par[ge.h - 1]}${tee.m ? `, ${tee.m[ge.h - 1]} m off tee ${tee.id}` : ""}.`;
}
// Writes one hole without touching the rest of the event document.
async function geoWrite(k, h, val){
  const ref = fs.doc("event/main"), FP = firebase.firestore.FieldPath;
  try { await ref.update(new FP("courses", k, "geo", String(h)), val || firebase.firestore.FieldValue.delete()); }
  catch (e) {
    if (e.code !== "not-found") throw e;
    const full = clone(ev); full.courses[k].geo = Object.assign({}, full.courses[k].geo);
    if (val) full.courses[k].geo[h] = val; else delete full.courses[k].geo[h];
    await ref.set(full);
  }
}
function geSave(){
  if (blocked()) return;
  const p = ge.pts; if (!p.t || !p.g) { toast("Place at least the tee and the middle of the green."); return; }
  const val = {}; for (const [k] of GE_MODES) if (p[k]) val[k] = p[k].map(x => Math.round(x * 1e6) / 1e6);
  const h = ge.h; geoWrite(ge.k, h, val).catch(onWriteError);
  toast(`Hole ${h} saved`); ge.dirty = false;
  if (h < 18) geHole(h + 1); else geDraw();
}
function geClear(){
  if (blocked()) return;
  if (holeGeo(ge.k, ge.h)) { if (!confirm(`Remove the saved map for hole ${ge.h}?`)) return; geoWrite(ge.k, ge.h, null).catch(onWriteError); }
  geRemember(); ge.hist[ge.hist.length - 1].dirty = true; // undoing a clear brings the points back, ready to save again
  ge.pts = {}; ge.mode = "t"; ge.dirty = false; geDraw();
}
async function geFind(){
  const q = val("ge-q").trim(); if (!q || !ge.map) return;
  try {
    const r = await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`)).json();
    if (r[0]) ge.map.setView([+r[0].lat, +r[0].lon], 16); else toast("Couldn't find that place.");
  } catch { toast("Search isn't working. Pan the map instead."); }
}
function geMe(){
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(p => ge.map && ge.map.setView([p.coords.latitude, p.coords.longitude], 18), () => toast("Couldn't get your location."), { enableHighAccuracy: true, timeout: 15000 });
}

// ---------- match graph ----------
// How the match stood after each hole: above the line one side is up, below the other.
function matchGraph(m, st){
  const hs = Object.keys(st.after).map(Number).sort((x, y) => x - y); if (!hs.length) return "";
  const pts = [[0, 0], ...hs.map(h => [h, st.after[h]])], top = Math.max(2, ...pts.map(p => Math.abs(p[1])));
  const W = 360, H = 150, L = 34, R = 10, T = 10, B = 22;
  const x = h => L + h * (W - L - R) / 18, y = v => T + (top - v) * (H - T - B) / (2 * top), y0 = y(0);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
  const area = `${line}L${x(pts[pts.length - 1][0]).toFixed(1)},${y0}L${x(0)},${y0}Z`;
  const id = "w" + m.id;
  let grid = "";
  for (let v = -top; v <= top; v++) grid += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--${v ? "line" : "muted"})" stroke-width="${v ? 1 : 1.5}"/>`;
  const yl = v => `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v === 0 ? "AS" : Math.abs(v)}</text>`;
  // Every hole is labelled, with a small tick; holes played so far are in darker text.
  const xl = h => `<line x1="${x(h)}" x2="${x(h)}" y1="${H - B}" y2="${H - B + 3}" stroke="var(--line)"/><text x="${x(h)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--${st.after[h] != null ? "ink" : "muted"})">${h}</text>`;
  const desc = (h, v) => `After the ${ordinal(h)}: ${v === 0 ? "all square" : `${teamName(v > 0 ? "A" : "B")} ${Math.abs(v)} up`}`;
  const hits = hs.map(h => `<rect x="${x(h) - 9}" y="${T}" width="18" height="${H - T - B}" fill="transparent" data-wtip="${esc(desc(h, st.after[h]))}"/>`).join("");
  const dots = pts.slice(1).map(p => `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4" fill="${p[1] > 0 ? "var(--ta)" : p[1] < 0 ? "var(--tb)" : "var(--muted)"}" stroke="var(--surface)" stroke-width="2"/>`).join("");
  const lastH = hs[hs.length - 1];
  return `<div class="card worm"><b>Match graph</b>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Match position after each hole. ${esc(desc(lastH, st.after[lastH]))}.">
      <defs><clipPath id="${id}a"><rect x="0" y="0" width="${W}" height="${y0}"/></clipPath><clipPath id="${id}b"><rect x="0" y="${y0}" width="${W}" height="${H}"/></clipPath></defs>
      ${grid}${Array.from({ length: 2 * top + 1 }, (_, i) => i - top).filter(v => top <= 5 || v % 2 === 0).map(yl).join("")}${Array.from({ length: 18 }, (_, i) => xl(i + 1)).join("")}
      <line x1="${x(9.5)}" x2="${x(9.5)}" y1="${T}" y2="${H - B}" stroke="var(--line)" stroke-dasharray="3 3"/>
      <path d="${area}" fill="var(--ta)" opacity=".16" clip-path="url(#${id}a)"/><path d="${area}" fill="var(--tb)" opacity=".16" clip-path="url(#${id}b)"/>
      <path d="${line}" fill="none" stroke="var(--ta)" stroke-width="2" stroke-linejoin="round" clip-path="url(#${id}a)"/>
      <path d="${line}" fill="none" stroke="var(--tb)" stroke-width="2" stroke-linejoin="round" clip-path="url(#${id}b)"/>
      <line x1="${x(0)}" x2="${x(lastH)}" y1="${y0}" y2="${y0}" stroke="var(--muted)" stroke-width="1.5" opacity="${pts.some(p => p[1] === 0 && p[0]) ? 1 : 0}"/>
      ${dots}${hits}</svg>
    <div class="legend"><span><span class="chip" style="background:var(--ta);min-width:0;width:10px;height:10px;padding:0"></span> ${esc(teamName("A"))} up</span><span><span class="chip" style="background:var(--tb);min-width:0;width:10px;height:10px;padding:0"></span> ${esc(teamName("B"))} up</span></div>
    <div class="tip" aria-live="polite">${esc(desc(lastH, st.after[lastH]))}. Tap the graph for any hole.</div></div>`;
}
function wormTip(e){
  const r = e.target.closest && e.target.closest("[data-wtip]"); if (!r) return;
  const tip = r.closest(".worm").querySelector(".tip"); if (tip) tip.textContent = r.dataset.wtip;
}
document.addEventListener("pointerover", wormTip);
document.addEventListener("click", wormTip);

// ---------- latest results feed ----------
function feedItems(){
  const out = [];
  for (const m of readyMatches()) {
    const st = matchState(m);
    for (let h = 1; h <= 18; h++) {
      const s = m.scores[h], r = st.res[h];
      if (r && s && s.t && st.after[h] != null) out.push({ m, st, h, r, t: s.t });
    }
  }
  return out.sort((a, b) => b.t - a.t);
}
function agoTxt(t){
  const d = Date.now() - t, mins = Math.round(d / 60000);
  if (mins < 1) return "now";
  if (mins < 60) return `${mins} min ago`;
  const dt = new Date(t), clock = dt.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  return dt.toDateString() === new Date().toDateString() ? clock : `${dt.toLocaleDateString("en-GB", { weekday: "short" })} ${clock}`;
}
function renderFeed(){
  const items = feedItems();
  if (!items.length) { $app.innerHTML = `<h2 class="sec">Live</h2><div class="empty">Every hole scored in any match appears here as it happens, newest first.</div>`; return; }
  const shown = items.slice(0, ui.feedMore ? 200 : 40);
  const rows = shown.map(({ m, st, h, r, t }) => {
    const names = side => m[side].map(sname).join(" & ");
    const what = r.w === "H" ? `${ordinal(h)} halved` : `${esc(names(r.w.toLowerCase()))} win the ${ordinal(h)}`;
    const last = Math.max(...Object.keys(st.after).map(Number)), after = st.after[h];
    const where = st.status === "final" && h === last
      ? (st.leader ? `${esc(teamName(st.leader))} win the match ${esc(st.text)}` : "Match halved")
      : after === 0 ? `All square thru ${h}` : `${esc(teamName(after > 0 ? "A" : "B"))} ${Math.abs(after)} up thru ${h}`;
    const col = r.w === "H" ? "var(--line)" : `var(--t${r.w.toLowerCase()})`;
    return `<button data-act="open" data-id="${m.id}"><span class="stripe" style="background:${col}"></span>
      <span class="w">${what} · ${where}<small>R${m.round} ${FORMATS[m.format].label} M${m.slot} · ${esc(names("a"))} v ${esc(names("b"))}</small></span><span class="ago">${agoTxt(t)}</span></button>`;
  }).join("");
  const more = items.length > 40 ? `<button class="btn" data-act="feedmore" style="justify-self:start;margin:4px 12px 10px">${ui.feedMore ? "Show fewer" : `Show all ${items.length}`}</button>` : "";
  $app.innerHTML = `<h2 class="sec">Live</h2><p class="lead">Every hole as it's scored, newest first. Tap one to open the match.</p>
    <section class="round"><div class="feed">${rows}</div>${more}</section>`;
}
setInterval(() => { if (ui.tab === "live" && !document.hidden) renderFeed(); }, 60000);

// ---------- stats & awards ----------
function eventStats(){
  const per = {}, parts = {}, holes = {}, team = { A: 0, B: 0, H: 0 };
  const P = id => per[id] = per[id] || { won: 0, gb: 0, nb: 0 };
  let biggest = null, comeback = null, distance = 0, finished = 0;
  for (const m of readyMatches()) {
    const st = matchState(m);
    for (let h = 1; h <= 18; h++) {
      const r = st.res[h];
      if (r && st.after[h] != null) { if (r.w === "H") team.H++; else { team[r.w]++; m[r.w.toLowerCase()].forEach(id => P(id).won++); } }
      const s = m.scores[h] || {}, par = m.c.par[h-1];
      for (const k of entryKeys(m)) {
        const v = s[k]; if (typeof v !== "number") continue;
        const net = v - strokesOn(shotsForKey(m, k), m.c.si[h-1]), ids = k.length === 2 ? [m[k[0]][+k[1]]] : m[k];
        ids.forEach(id => { if (v < par) P(id).gb++; if (net < par) P(id).nb++; });
        const c = holes[m.r.course] = holes[m.r.course] || {}, a = c[h] = c[h] || { n: 0, over: 0 }; a.n++; a.over += v - par;
      }
    }
    for (const side of ["a", "b"]) {
      const T = side.toUpperCase(), key = [...m[side]].sort().join("+");
      const p = parts[key] = parts[key] || { ids: m[side], T, n: 0, P: 0, W: 0, H: 0, L: 0, pts: 0 }; p.n++;
      if (st.status !== "final") continue;
      p.P++; if (!st.leader) { p.H++; p.pts += m.r.points / 2; } else if (st.leader === T) { p.W++; p.pts += m.r.points; } else p.L++;
    }
    if (st.status !== "final") continue;
    finished++; if (st.played === 18) distance++;
    if (st.leader) { const score = Math.abs(st.diff) * 100 + (18 - st.played); if (!biggest || score > biggest.score) biggest = { m, st, score }; }
    for (const S of st.leader ? [st.leader] : ["A", "B"]) {
      const sign = S === "A" ? 1 : -1, worst = Math.max(0, ...Object.values(st.after).map(v => -v * sign));
      if (worst >= 2 && (!comeback || worst > comeback.worst)) comeback = { m, st, S, worst };
    }
  }
  return { per, parts, holes, team, biggest, comeback, distance, finished };
}
function renderStats(){
  const s = eventStats(), ids = Object.keys(players);
  const recs = Object.fromEntries(ids.map(id => [id, playerRecord(id)]));
  const best = (score, min = 1) => { const top = Math.max(0, ...ids.map(score)); return top >= min ? { v: top, ids: ids.filter(id => score(id) === top) } : null; };
  const who = list => list.map(pname).join(", ");
  const teamOf = list => { const t = new Set(list.map(id => players[id] && players[id].team)); return t.size === 1 ? [...t][0] : null; };
  const award = (k, list, v, d) => `<div class="award" style="${list && teamOf(list) ? `border-top-color:var(--t${teamOf(list).toLowerCase()})` : ""}"><span class="k">${k}</span><span class="v">${v}</span><span class="d">${d}</span></div>`;
  const pairTxt = (m, side) => m[side].map(sname).join(" & ");
  let aw = "";
  const pts = best(id => recs[id].pts, 0.5);
  if (pts) aw += award("Top points scorer", pts.ids, esc(who(pts.ids)), `${half(pts.v)} point${pts.v === 1 ? "" : "s"}${pts.ids.length === 1 ? ` · ${recs[pts.ids[0]].W}-${recs[pts.ids[0]].H}-${recs[pts.ids[0]].L}` : ""}`);
  const won = best(id => (s.per[id] || {}).won || 0);
  if (won) aw += award("Most holes won", won.ids, esc(who(won.ids)), `${won.v} holes won by their side`);
  const gb = best(id => (s.per[id] || {}).gb || 0);
  if (gb) aw += award("Birdie machine", gb.ids, esc(who(gb.ids)), `${gb.v} gross birdie${gb.v > 1 ? "s" : ""} or better (pair formats count for both)`);
  const nb = best(id => (s.per[id] || {}).nb || 0);
  if (nb) aw += award("Most net birdies", nb.ids, esc(who(nb.ids)), `${nb.v} net birdie${nb.v > 1 ? "s" : ""} or better`);
  if (s.biggest) { const { m, st } = s.biggest, side = st.leader.toLowerCase();
    aw += award("Biggest win", m[side], esc(st.text), `${esc(pairTxt(m, side))} (${esc(teamName(st.leader))}) in R${m.round} ${FORMATS[m.format].label}`); }
  if (s.comeback) { const { m, st, S, worst } = s.comeback, side = S.toLowerCase();
    aw += award("Best comeback", m[side], `From ${worst} down`, `${esc(pairTxt(m, side))} (${esc(teamName(S))}) ${st.leader ? `won ${esc(st.text)}` : "halved the match"} in R${m.round}`); }
  const pl = Object.values(s.parts).filter(p => p.P).sort((a, b) => b.pts - a.pts || b.W - a.W);
  if (pl.length && pl[0].pts > 0) aw += award("Best partnership", pl[0].ids, esc(pl[0].ids.map(sname).join(" & ")), `${half(pl[0].pts)} pts · ${pl[0].W}-${pl[0].H}-${pl[0].L} together`);
  if (s.finished) aw += award("Went the distance", null, `${s.distance} of ${s.finished}`, "finished matches that reached the 18th");
  const tot = s.team.A + s.team.B + s.team.H;
  if (tot) aw += award("Holes won", null, `<span style="color:var(--ta)">${s.team.A}</span> – <span style="color:var(--tb)">${s.team.B}</span>`, `${esc(teamName("A"))} v ${esc(teamName("B"))}, ${s.team.H} halved`);
  if (!aw) { $app.innerHTML = `<h2 class="sec">Stats</h2><div class="empty">Awards and stats appear here once scores are in.</div>`; return; }

  const prow = ids.map(id => ({ id, r: recs[id], x: s.per[id] || { won: 0, gb: 0, nb: 0 } })).filter(o => o.r.list.length)
    .sort((a, b) => b.r.pts - a.r.pts || b.x.won - a.x.won || a.r.L - b.r.L);
  const table = prow.map(({ id, r, x }) => `<tr class="click" data-act="profile" data-id="${id}"><td style="border-left:4px solid var(--t${players[id].team.toLowerCase()})">${esc(pname(id))}</td><td><b>${half(r.pts)}</b></td><td>${r.W}-${r.H}-${r.L}</td><td>${x.won}</td><td>${x.gb}</td><td>${x.nb}</td></tr>`).join("");
  const ptab = pl.map(p => `<tr><td style="border-left:4px solid var(--t${p.T.toLowerCase()})">${esc(p.ids.map(sname).join(" & "))}</td><td>${p.P}</td><td>${p.W}-${p.H}-${p.L}</td><td><b>${half(p.pts)}</b></td></tr>`).join("");
  const hcards = COURSE_KEYS.filter(k => s.holes[k]).map(k => {
    const c = course(k), H = Array.from({ length: 18 }, (_, i) => i + 1), a = s.holes[k];
    const avg = h => a[h] && a[h].n ? a[h].over / a[h].n : null;
    const ranked = H.filter(h => a[h] && a[h].n >= 2).sort((x, y) => avg(y) - avg(x));
    const fmt = v => v == null ? "" : (v > 0 ? "+" : "") + v.toFixed(1);
    return `<div class="card"><div style="padding:10px 12px 0"><b>${esc(c.name)}</b>${ranked.length >= 6 && avg(ranked[0]) > avg(ranked[ranked.length - 1]) ? ` <span class="hint">Hardest: ${ranked[0]} (${fmt(avg(ranked[0]))}) · Easiest: ${ranked[ranked.length - 1]} (${fmt(avg(ranked[ranked.length - 1]))})</span>` : ""}</div>
      <div class="scroll" style="padding:8px 0"><table class="sc"><thead><tr><th>Hole</th>${H.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>
      <tr><td class="lbl">Par</td>${H.map(h => `<td>${c.par[h-1]}</td>`).join("")}</tr>
      <tr><td class="lbl">Avg v par</td>${H.map(h => `<td>${fmt(avg(h))}</td>`).join("")}</tr>
      <tr><td class="lbl">Scores</td>${H.map(h => `<td class="hint">${a[h] ? a[h].n : ""}</td>`).join("")}</tr></tbody></table></div></div>`;
  }).join("");
  $app.innerHTML = `<h2 class="sec">Awards</h2><div class="awards">${aw}</div>
    ${table ? `<h2 class="sec">Player stats</h2><div class="card"><div class="scroll"><table class="list" style="width:100%"><thead><tr><th>Player</th><th>Pts</th><th>W-H-L</th><th>Holes won</th><th>Birdies</th><th>Net birdies</th></tr></thead><tbody>${table}</tbody></table></div></div>
      <p class="hint">Holes won counts holes their side won in matches they played. Birdies are gross strokes under par; net birdies take off shots received. In foursomes, Chapman and greensomes the pair's score counts for both players. Holes entered only as a result (no strokes) count for holes won but not birdies.</p>` : ""}
    ${ptab ? `<h2 class="sec">Partnerships</h2><div class="card"><div class="scroll"><table class="list" style="width:100%"><thead><tr><th>Pair</th><th>Played</th><th>W-H-L</th><th>Pts</th></tr></thead><tbody>${ptab}</tbody></table></div></div>` : ""}
    ${hcards ? `<h2 class="sec">How the holes played</h2><p class="lead">Average gross strokes over par for every score entered (each ball in fourball, each pair in the other formats).</p>${hcards}` : ""}`;
}

// ---------- share the score as an image ----------
let h2cP = null, shareFile = null;
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => { s.remove(); rej(new Error("script")); }; document.head.appendChild(s); }); }
// Two taps: the first makes the picture, the second shares it (phones only allow sharing straight after a tap).
async function makeShareImage(btn){
  const card = document.querySelector(".scard"); if (!card) return;
  btn.disabled = true; btn.textContent = "Making the image…";
  const old = card.style.cssText;
  try {
    h2cP = h2cP || loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js").catch(e => { h2cP = null; throw e; });
    await h2cP;
    card.style.maxHeight = "none"; card.style.overflow = "visible";
    const canvas = await window.html2canvas(card, { scale: 2, backgroundColor: getComputedStyle(card).backgroundColor, ignoreElements: el => el.hasAttribute && el.hasAttribute("data-noshot") });
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    shareFile = new File([blob], `${fileBase()}-score.png`, { type: "image/png" });
  } catch (e) { console.error(e); toast("Couldn't make the image."); }
  finally { card.style.cssText = old; }
  renderModal();
}
async function shareImage(){
  if (!shareFile) return;
  if (navigator.canShare && navigator.canShare({ files: [shareFile] })) {
    try { await navigator.share({ files: [shareFile], title: `${ev.name} ${ev.year}` }); } catch (e) { if (e.name !== "AbortError") toast("Couldn't share. Try again."); }
  } else {
    const a = document.createElement("a"); a.href = URL.createObjectURL(shareFile); a.download = shareFile.name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast("Image downloaded");
  }
}

// ---------- offline ----------
// sw.js keeps the app on the phone; this section saves hole map photos into the same store it reads.
const TILE_CACHE = "bx-tiles", OFF_KEY = "bx-offline";
let installPrompt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; if (ui.tab === "course") offlineRefresh(); });
function standalone(){ return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; }
function isIos(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
function installTip(){
  if (standalone()) return "Installed on this phone, so it opens with no signal.";
  if (isIos()) return "Add it to your Home Screen so it opens with no signal: in Safari tap Share, then Add to Home Screen. This also stops the phone clearing the saved maps.";
  return "Install it so it opens with no signal: browser menu (⋮), then Install app or Add to Home screen.";
}
// Photos covering each mapped hole: the whole hole at three levels of detail, plus close-ups round the green and tee.
function offlineTiles(){
  const out = new Set();
  const area = (pts, m) => {
    const la = pts.map(p => p[0]), ln = pts.map(p => p[1]), dLat = m / 111320, dLng = m / (111320 * Math.cos(la[0] * Math.PI / 180));
    return [Math.max(...la) + dLat, Math.min(...ln) - dLng, Math.min(...la) - dLat, Math.max(...ln) + dLng];
  };
  const add = (z, [n, w, s, e]) => {
    const a = wpx([n, w], z), b = wpx([s, e], z);
    for (let x = Math.floor(a[0] / 256); x <= Math.floor(b[0] / 256); x++) for (let y = Math.floor(a[1] / 256); y <= Math.floor(b[1] / 256); y++) out.add(TILE_URL(z, x, y));
  };
  for (const k of COURSE_KEYS) for (let h = 1; h <= 18; h++) {
    const g = holeGeo(k, h); if (!g) continue;
    const whole = area([g.t, g.d, g.f, g.b, g.g].filter(Boolean), Math.max(60, metres(g.t, g.g) * 0.35));
    for (const z of [16, 17, 18]) add(z, whole);
    add(19, area([g.g, g.f, g.b].filter(Boolean), 45)); add(19, area([g.t], 30));
  }
  return [...out];
}
function geoSig(){ return JSON.stringify(COURSE_KEYS.map(k => course(k).geo || {})); }
function offSaved(){ try { return JSON.parse(localStorage.getItem(OFF_KEY) || "null"); } catch { return null; } }
const dl = { running: false, done: 0, total: 0, failed: 0 };
function offlineCard(){
  const mapped = COURSE_KEYS.reduce((n, k) => n + mappedCount(k), 0), saved = offSaved();
  let status;
  if (dl.running) status = `Downloading ${dl.done} of ${dl.total} photos…`;
  else if (!mapped) status = "No hole maps yet. Once the organisers have placed the holes in Setup, download them here.";
  else if (!("caches" in window)) status = "This browser can't save the maps for offline use.";
  else if (saved) status = `Hole map photos saved on this phone ${agoTxt(saved.at)}${saved.failed ? `, though ${saved.failed} of them couldn't be downloaded` : ""}.` +
    (saved.sig !== geoSig() ? " Holes have been mapped or moved since then, so download again." : "");
  else status = `Not downloaded on this phone yet. It's about ${Math.max(1, Math.round(offlineTiles().length * 25 / 1024))} MB, so do it on wifi.`;
  const pct = dl.total ? (dl.done / dl.total * 100).toFixed(1) : 0;
  return `<div id="offcard" style="display:grid;gap:10px">
    <p class="hint">${esc(installTip())}</p>
    ${installPrompt && !standalone() ? `<div><button class="btn" data-act="install">Install app</button></div>` : ""}
    <p class="hint">Scores entered with no signal are kept on the phone and sent when signal returns. GPS distances work with no signal. To see the hole maps with no signal, download them first:</p>
    <p class="hint" id="offstatus"><b>${esc(status)}</b></p>
    ${dl.running ? `<div class="bar"><i style="left:0;width:${pct}%;background:var(--accent)"></i></div>` : ""}
    <div class="row"><button class="btn pri" data-act="offdl" ${dl.running || !mapped ? "disabled" : ""}>${saved ? "Download hole maps again" : "Download hole maps for offline"}</button>
      ${saved && !dl.running ? `<button class="btn" data-act="offclear">Remove saved maps</button>` : ""}</div></div>`;
}
// Short status for the small tile on the Course tab; the full card opens in a popup.
function offlineShort(){
  const saved = offSaved();
  if (dl.running) return `Downloading hole maps… ${dl.total ? Math.round(dl.done / dl.total * 100) : 0}%`;
  if (saved) return saved.sig !== geoSig() ? "Hole maps saved, but out of date" : "Hole maps saved on this phone";
  return standalone() ? "Hole maps not saved yet" : "Not installed · hole maps not saved";
}
function offlineMini(){
  return `<button class="card offmini" id="offmini" data-act="offopen"><span><b>No signal on the course?</b><small>${esc(offlineShort())}</small></span><span class="btn">Set up</span></button>`;
}
function renderOffline(el){
  el.hidden = false;
  el.innerHTML = `<div class="modal" data-act="closeprofile"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="off-title">
    <header style="background:var(--accent)"><h2 id="off-title">Use with no signal</h2><button class="x" data-act="closeprofile" aria-label="Close">✕</button></header>
    <div class="body">${offlineCard()}</div></div></div>`;
}
function offlineRefresh(){
  const el = document.getElementById("offcard"); if (el) el.outerHTML = offlineCard();
  const mini = document.getElementById("offmini"); if (mini) mini.outerHTML = offlineMini();
}
async function offlineDownload(){
  if (dl.running || !("caches" in window)) return;
  const urls = offlineTiles(); if (!urls.length) return;
  Object.assign(dl, { running: true, done: 0, total: urls.length, failed: 0 });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  offlineRefresh();
  const cache = await caches.open(TILE_CACHE);
  let next = 0, last = 0;
  const worker = async () => {
    while (next < urls.length) {
      const u = urls[next++];
      try {
        if (!(await cache.match(u))) {
          const res = await fetch(u, { mode: "cors", credentials: "omit" });
          if (!res.ok) throw new Error(res.status);
          await cache.put(u, res);
        }
      } catch { dl.failed++; }
      dl.done++;
      if (Date.now() - last > 250) { last = Date.now(); offlineRefresh(); }
    }
  };
  await Promise.all(Array.from({ length: 6 }, worker));
  dl.running = false;
  if (dl.failed === dl.total) toast("Couldn't download the maps. Check your signal and try again.");
  else {
    try { localStorage.setItem(OFF_KEY, JSON.stringify({ at: Date.now(), n: dl.total - dl.failed, failed: dl.failed, sig: geoSig() })); } catch {}
    toast(dl.failed ? `Saved, but ${dl.failed} photos failed. Try again on better signal.` : "Hole maps saved for offline");
  }
  offlineRefresh();
}
async function offlineClear(){
  try { await caches.delete(TILE_CACHE); localStorage.removeItem(OFF_KEY); } catch {}
  toast("Saved maps removed"); offlineRefresh();
}
function installTipBanner(){
  let dismissed = false; try { dismissed = !!localStorage.getItem("bx-tip"); } catch {}
  if (standalone() || dismissed) return "";
  return `<div class="notice" style="display:flex;gap:10px;align-items:flex-start"><span style="flex:1"><b>On the course with no signal?</b> Install the app and save the hole maps on your phone.</span><button class="btn" data-act="offopen">Set up</button><button class="btn" data-act="tipclose" aria-label="Dismiss">✕</button></div>`;

// ---------- photos & videos ----------
// Files go to Firebase Storage under media/<id>/; one Firestore document per item in "media" holds the
// caption, who added it, the match it's from and the download links. Photos are shrunk on the phone first.
let media = [], store = null;
const MAX_VIDEO = 200 * 1024 * 1024;
const up = { busy: false, pct: 0, label: "", err: "", file: null };
function deviceId(){
  try { let d = localStorage.getItem("bx-device"); if (!d) { d = Math.random().toString(36).slice(2, 12); localStorage.setItem("bx-device", d); } return d; } catch { return "anon"; }
}
function myName(){ try { return localStorage.getItem("bx-name") || ""; } catch { return ""; } }
function matchLabel(mid){
  const m = getMatch(mid); if (!m.ready) return `R${m.round} M${m.slot}`;
  return `R${m.round} M${m.slot} · ${m.a.map(sname).join(" & ")} v ${m.b.map(sname).join(" & ")}`;
}
function canDelete(it){ return it.owner === deviceId() || !setupLocked(); }
function fmtDur(s){ s = Math.round(s || 0); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

// Shrinks a picture to at most `max` pixels on its longest side, as a JPEG.
async function shrinkImage(src, max, quality){
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return { blob: await new Promise(r => c.toBlob(r, "image/jpeg", quality)), w: c.width, h: c.height };
}
// A still from about a second into a video, for the grid; null if the phone can't make one.
async function videoStill(file){
  const url = URL.createObjectURL(file);
  try {
    const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.preload = "metadata"; v.src = url;
    await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = rej; setTimeout(rej, 8000); });
    const dur = v.duration;
    v.currentTime = Math.min(1, (dur || 2) / 2);
    await new Promise((res, rej) => { v.onseeked = res; setTimeout(rej, 8000); });
    const k = Math.min(1, 480 / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement("canvas"); c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    return { blob: await new Promise(r => c.toBlob(r, "image/jpeg", 0.75)), dur, w: v.videoWidth, h: v.videoHeight };
  } catch { return null; } finally { URL.revokeObjectURL(url); }
}
function putFile(path, blob, type, onPct){
  return new Promise((res, rej) => {
    const task = store.ref(path).put(blob, { contentType: type, cacheControl: "public,max-age=31536000" });
    task.on("state_changed", s => onPct && onPct(s.bytesTransferred / Math.max(1, s.totalBytes)), rej,
      async () => res(await task.snapshot.ref.getDownloadURL()));
  });
}
async function uploadMedia(file){
  if (up.busy) return;
  if (!store) { toast("Photo storage isn't set up yet. See the README."); return; }
  if (!navigator.onLine) { toast("Uploading needs signal. Try again when you have some."); return; }
  const isVideo = file.type.startsWith("video/");
  if (!isVideo && !file.type.startsWith("image/")) { toast("That isn't a photo or a video."); return; }
  if (isVideo && file.size > MAX_VIDEO) { toast(`That video is ${Math.round(file.size / 1048576)} MB. The limit is 200 MB, so trim it or film in 1080p.`); return; }
  const caption = val("md-caption").trim(), by = val("md-name").trim(), mid = val("md-match");
  try { localStorage.setItem("bx-name", by); } catch {}
  Object.assign(up, { busy: true, pct: 0, err: "", file, label: isVideo ? "Preparing the video…" : "Shrinking the photo…" }); mediaProgress();
  const id = fs.collection("media").doc().id, base = `media/${id}/`;
  try {
    const doc = { type: isVideo ? "video" : "photo", caption, by, match: mid || null, at: Date.now(), owner: deviceId() };
    if (isVideo) {
      const still = await videoStill(file);
      const ext = (file.name.split(".").pop() || "mp4").toLowerCase().replace(/[^a-z0-9]/g, "") || "mp4";
      up.label = "Uploading the video…"; mediaProgress();
      doc.url = await putFile(base + "video." + ext, file, file.type, p => { up.pct = p; mediaProgress(); });
      doc.path = base + "video." + ext;
      if (still) { doc.thumb = await putFile(base + "thumb.jpg", still.blob, "image/jpeg"); doc.dur = still.dur; doc.w = still.w; doc.h = still.h; }
    } else {
      const src = URL.createObjectURL(file);
      try {
        const big = await shrinkImage(src, 1600, 0.82), small = await shrinkImage(src, 480, 0.75);
        up.label = "Uploading the photo…"; mediaProgress();
        doc.url = await putFile(base + "photo.jpg", big.blob, "image/jpeg", p => { up.pct = p; mediaProgress(); });
        doc.thumb = await putFile(base + "thumb.jpg", small.blob, "image/jpeg");
        doc.path = base + "photo.jpg"; doc.w = big.w; doc.h = big.h;
      } finally { URL.revokeObjectURL(src); }
    }
    await fs.collection("media").doc(id).set(doc);
    Object.assign(up, { busy: false, file: null, pct: 0 });
    const cap = document.getElementById("md-caption"); if (cap) cap.value = "";
    toast(isVideo ? "Video added" : "Photo added");
  } catch (e) {
    console.error(e);
    Object.assign(up, { busy: false, err: e && e.code === "storage/unauthorized" ? "Storage refused the upload. Check the Storage rules in Firebase." : "The upload didn't finish. Check your signal and try again." });
  }
  mediaProgress(); if (ui.tab === "photos") render(true);
}
function mediaProgress(){
  const el = document.getElementById("md-progress"); if (!el) return;
  el.innerHTML = up.busy ? `<p class="hint"><b>${esc(up.label)}</b>${up.pct ? ` ${Math.round(up.pct * 100)}%` : ""}</p><div class="bar"><i style="left:0;width:${(up.pct * 100).toFixed(1)}%;background:var(--accent)"></i></div>`
    : up.err ? `<p class="hint" style="color:var(--bad)">${esc(up.err)} ${up.file ? `<button class="btn" data-act="mdretry">Try again</button>` : ""}</p>` : "";
}
async function deleteMedia(id){
  const it = media.find(x => x.id === id); if (!it || !canDelete(it)) return;
  if (!confirm(`Delete this ${it.type} for everyone?`)) return;
  try {
    await Promise.all([it.path, it.thumb && `media/${id}/thumb.jpg`].filter(Boolean).map(p => store.ref(p).delete().catch(() => {})));
    await fs.collection("media").doc(id).delete();
    ui.media = null; renderModal(); toast("Deleted");
  } catch (e) { onWriteError(e); }
}
function mediaTile(it){

function pairPreview(mid, a, b){
  const r0 = ev.rounds[roundOf(mid) - 1];
  if (!(a.length === 2 && b.length === 2 && [...a, ...b].every(id => id && players[id]))) return "Pick 4 players to see shots.";
  if (new Set([...a, ...b]).size < 4) return "A player is picked twice.";
  const n = roundOf(mid), r = shotsFor(r0.format, a.map(id => roundHcp(id, n)), b.map(id => roundHcp(id, n)));
  if (r0.format === "fourball") return "Shots: " + [...a.map((id, i) => `${esc(pname(id))} ${r.shots.a[i]}`), ...b.map((id, i) => `${esc(pname(id))} ${r.shots.b[i]}`)].join(" · ");
  return `Shots: ${esc(teamName("A"))} ${r.shots.a[0]} · ${esc(teamName("B"))} ${r.shots.b[0]}`;
}

async function saveCourse(){
  if (blocked()) return;
  const e = clone(ev);
  for (const k of COURSE_KEYS) {
    const par = [], si = [];
    for (let i = 0; i < 18; i++) { par.push(parseInt(val(`${k}-par-${i}`)) || 4); si.push(parseInt(val(`${k}-si-${i}`)) || i + 1); }
    if ([...si].sort((x, y) => x - y).some((v, i) => v !== i + 1)) { toast(`${ev.courses[k].name}: stroke index must use each number 1–18 once.`); return; }
    const tees = ev.courses[k].tees.map((t, j) => ({ ...t, name: val(`${k}-tn-${j}`).trim() || t.name, rating: parseFloat(val(`${k}-tr-${j}`)), slope: parseFloat(val(`${k}-ts-${j}`)) }));
    if (tees.some(t => !isFinite(t.rating) || !(t.slope >= 55 && t.slope <= 155))) { toast(`${ev.courses[k].name}: every tee needs a course rating and a slope between 55 and 155.`); return; }
    e.courses[k] = { ...ev.courses[k], name: val(`${k}-name`).trim() || ev.courses[k].name, tees, par, si };
  }
  e.allow = { fourball: +val("a-fb") || 90, foursomes: +val("a-fs") || 50, chapLow: +val("a-cl") || 60, chapHigh: +val("a-ch") || 40, greenLow: +val("a-gl") || 60, greenHigh: +val("a-gh") || 40 };
  await writeEvent(e, "Courses saved");
}
async function saveBios(){
  if (blocked()) return;
  const batch = fs.batch(); let n = 0;
  for (const [id, p] of Object.entries(players)) {
    const d = { bio: val("bio-" + id).trim(), caps: val("caps-" + id).trim(), short: val("short-" + id).trim() };
    if (d.bio !== (p.bio || "") || d.caps !== (p.caps || "") || d.short !== (p.short || "")) { batch.update(fs.doc("players/" + id), d); n++; }
  }
  if (!n) { toast("No changes to save"); return; }
  try { await batch.commit(); toast(`Saved ${n} profile${n > 1 ? "s" : ""}`); render(true); } catch (e) { onWriteError(e); }
}
async function saveHcps(){
  if (blocked()) return;
  const batch = fs.batch(); let n = 0, bad = null;
  for (const [id, p] of Object.entries(players)) {
    const ch = {};
    for (let r = 1; r <= 4; r++) { const raw = val(`ch-${id}-${r}`).trim(); if (raw === "") { ch["r" + r] = null; continue; }
      const v = parseIndex(raw); if (v == null) { bad = `${p.name} ${roundLabel(r)}`; continue; } ch["r" + r] = Math.round(v); }
    if (JSON.stringify(ch) !== JSON.stringify(Object.assign({ r1: null, r2: null, r3: null, r4: null }, p.ch || {}))) { batch.update(fs.doc("players/" + id), { ch }); n++; }
  }
  if (bad) { toast(`Couldn't read the handicap for ${bad}.`); return; }
  if (!n) { toast("No changes to save"); return; }
  try { await batch.commit(); toast(`Saved course handicaps for ${n} player${n > 1 ? "s" : ""}`); render(true); } catch (e) { onWriteError(e); }
}

function csvCell(v){
  if (v == null) return "";
  let t = String(v);
  if (/^[=@]/.test(t)) t = "'" + t; // stop spreadsheets treating text as a formula
  return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}
function toCsv(rows){ return "\ufeff" + rows.map(r => r.map(csvCell).join(",")).join("\r\n"); }
function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function fileBase(){ return `${ev.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "blacklock"}-${ev.year}`; }
function readyMatches(){ const out = []; for (let r = 1; r <= 4; r++) for (const mid of matchIds(r)) { const m = getMatch(mid); if (m.ready) out.push(m); } return out; }
function basisText(m){
  if (m.format === "fourball") return `${ev.allow.fourball}% per player, off the lowest`;
  if (m.format === "foursomes") return `${ev.allow.foursomes}% of combined per pair`;
  const lo = m.format === "chapman" ? ev.allow.chapLow : ev.allow.greenLow, hi = m.format === "chapman" ? ev.allow.chapHigh : ev.allow.greenHigh;
  return `${lo}% low + ${hi}% high per pair`;
}
function strokeText(v){ return v == null || v === "" ? "" : v === "x" ? "P/U" : v; }
function exportMatches(){

function exportHoles(){
  const A = teamName("A"), B = teamName("B");
  const head = ["Event", "Year", "Round", "Format", "Course", "Tees", "Match", `${A} players`, `${B} players`, "Hole", "Par", "SI",
    `${A} strokes 1`, `${A} strokes 2`, `${B} strokes 1`, `${B} strokes 2`,
    `${A} shots on hole 1`, `${A} shots on hole 2`, `${B} shots on hole 1`, `${B} shots on hole 2`,
    "Entered as", "Hole won by", "Match after hole"];
  const rows = [];
  for (const m of readyMatches()) {
    const st = matchState(m), four = m.format === "fourball";
    for (let h = 1; h <= 18; h++) {
      const s = m.scores[h] || {}, r = st.res[h];
      if (!r && !Object.values(s).some(v => v != null && v !== "")) continue;
      const si = m.c.si[h-1], keys = four ? ["a0", "a1", "b0", "b1"] : ["a", null, "b", null];
      const after = st.after[h];
      rows.push([ev.name, ev.year, m.round, FORMATS[m.format].label, m.c.name, teeShort(m.tee), m.slot, m.a.map(pname).join(" & "), m.b.map(pname).join(" & "), h, m.c.par[h-1], si,
        ...keys.map(k => k ? strokeText(s[k]) : ""),

let restoreData = null, restoreArmed = false;
function readRestoreFile(file){
  const info = document.getElementById("restore-info"), btn = document.getElementById("restore-btn");
  restoreData = null; btn.disabled = true;
  if (!file) { info.textContent = ""; return; }
  file.text().then(txt => {
    const d = JSON.parse(txt);
    if (d.app !== "blacklock-xi" || !d.event || typeof d.players !== "object" || typeof d.matches !== "object") throw new Error("not a backup");
    restoreData = d; btn.disabled = false;
    const scored = Object.values(d.matches).filter(m => m && m.scores && Object.keys(m.scores).length).length;
    info.textContent = `Backup from ${new Date(d.exportedAt).toLocaleString()}: ${Object.keys(d.players).length} players, ${Object.keys(d.matches).length} matches (${scored} with scores).`;
  }).catch(() => { info.textContent = "That file isn't a Blacklock XI backup."; });
}
async function doRestore(btn){
  if (blocked() || !restoreData) return;
  if (!restoreArmed) { restoreArmed = true; btn.textContent = "Tap again to replace all data"; setTimeout(() => { if (restoreArmed) { restoreArmed = false; btn.textContent = "Restore backup"; } }, 4000); return; }
  restoreArmed = false; btn.textContent = "Restoring…";
  const b = fs.batch(), d = restoreData;
  b.set(fs.doc("event/main"), d.event);
  for (const [id, p] of Object.entries(d.players)) b.set(fs.doc("players/" + id), p);
  for (const id of Object.keys(players)) if (!(id in d.players)) b.delete(fs.doc("players/" + id));
  for (const [id, m] of Object.entries(d.matches)) b.set(fs.doc("matches/" + id), m);
  for (const id of Object.keys(matches)) if (!(id in d.matches)) b.delete(fs.doc("matches/" + id));
  try { await b.commit(); restoreData = null; toast("Backup restored"); render(true); } catch (e) { btn.textContent = "Restore backup"; onWriteError(e); }
}
async function writeEvent(e, msg){
